{{- if .Values.defaultDenyAll.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.defaultDenyAll.name | default "default-deny-all-ingress" }}
  namespace: {{ .Release.Namespace }}

spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "global-ingress-networking-policies.waypointName" . }}

  action: {{ .Values.defaultDenyAll.action | default "DENY" }}

  rules:
  - {}
{{- end }}
