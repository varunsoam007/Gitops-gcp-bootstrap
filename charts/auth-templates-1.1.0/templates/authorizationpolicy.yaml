{{- $defaults := .Values.auth_defaults | default dict }}
{{- if .Values.auth }}
{{- if .Values.auth.enabled }}
{{- $hostname := required "auth.hostname is required when auth.enabled is true" .Values.auth.hostname }}
{{- $gateway := default $defaults.gateway .Values.auth.gateway }}
{{- $gatewayNamespace := default $defaults.gatewayNamespace .Values.auth.gatewayNamespace }}
{{- $excludePaths := default $defaults.excludePaths .Values.auth.excludePaths }}
{{- $requiredRoles := .Values.auth.requiredRoles | default list }}
{{- $mode := default (default "interactive" $defaults.mode) .Values.auth.mode }}
{{/* Interactive mode — oauth2-proxy ext_authz */}}
{{- if eq $mode "interactive" }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-oauth2
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "auth-templates.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  action: CUSTOM
  provider:
    name: oauth2-proxy-ext-authz
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ $gateway }}
  rules:
    - to:
        - operation:
            hosts:
              - {{ $hostname | quote }}
            notPaths:
              - "/oauth2/*"
              - "/up"
              - "/metrics"
              {{- range $excludePaths }}
              - {{ . | quote }}
              {{- end }}
{{- if $requiredRoles }}
{{/* Deny users missing required roles */}}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-deny
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "auth-templates.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ $gateway }}
  action: DENY
  rules:
    - to:
        - operation:
            hosts:
              - {{ $hostname | quote }}
            notPaths:
              - "/oauth2/*"
              - "/up"
              - "/metrics"
              {{- range $excludePaths }}
              - {{ . | quote }}
              {{- end }}
      when:
        - key: request.headers[x-auth-request-groups]
          notValues:
            {{- range $requiredRoles }}
            - {{ . | quote }}
            - {{ printf "%s,*" . | quote }}
            - {{ printf "*,%s" . | quote }}
            - {{ printf "*,%s,*" . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{/* M2M mode — native Istio JWT validation */}}
{{- if eq $mode "m2m" }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-jwt-required
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "auth-templates.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ $gateway }}
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            hosts:
              - {{ $hostname | quote }}
            notPaths:
              - "/up"
              - "/metrics"
              {{- range $excludePaths }}
              - {{ . | quote }}
              {{- end }}
{{- if $requiredRoles }}
{{/* Deny JWTs missing required roles */}}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-deny-roles
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "auth-templates.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ $gateway }}
  action: DENY
  rules:
    - from:
        - source:
            requestPrincipals: ["*"]
      to:
        - operation:
            hosts:
              - {{ $hostname | quote }}
            notPaths:
              - "/up"
              - "/metrics"
              {{- range $excludePaths }}
              - {{ . | quote }}
              {{- end }}
      when:
        - key: request.auth.claims[roles]
          notValues:
            {{- range $requiredRoles }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
