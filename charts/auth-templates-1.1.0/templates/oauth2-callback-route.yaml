{{- $defaults := .Values.auth_defaults | default dict }}
{{- if .Values.auth }}
{{- if .Values.auth.enabled }}
{{- $mode := default (default "interactive" $defaults.mode) .Values.auth.mode }}
{{- if eq $mode "interactive" }}
{{- $hostname := required "auth.hostname is required when auth.enabled is true" .Values.auth.hostname }}
{{- $gateway := default $defaults.gateway .Values.auth.gateway }}
{{- $gatewayNamespace := default $defaults.gatewayNamespace .Values.auth.gatewayNamespace }}
{{- $platformAuthNamespace := default $defaults.platformAuthNamespace .Values.auth.platformAuthNamespace }}
{{- $platformAuthServiceName := default $defaults.platformAuthServiceName .Values.auth.platformAuthServiceName }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-oauth2-callback
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auth-templates.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gateway }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $platformAuthServiceName }}
          namespace: {{ $platformAuthNamespace }}
          port: 4180
          weight: 1
{{- end }}
{{- end }}
{{- end }}
