{{- if .Values.rbac.enabled }}
{{- if not .Values.rbac.subjects }}
{{- fail "rbac.enabled=true requires at least one entry in rbac.subjects" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rbac.roleName }}
  namespace: {{ .Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rbac.roleName }}
subjects:
{{- toYaml .Values.rbac.subjects | nindent 2 }}
{{- end }}
