{{- $resources := .Values.waypointResources | default dict -}}
{{- $gateway := $resources.gateway | default dict -}}
{{- $infrastructure := $gateway.infrastructure | default dict -}}
{{- $parametersRef := $infrastructure.parametersRef | default dict -}}
{{- if ($resources.enabled | default true) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "global-networking-policies.waypointName" . }}
  namespace: {{ .Release.Namespace }}
  {{- if $gateway.labels }}
  labels:
    {{- toYaml $gateway.labels | nindent 4 }}
  {{- end }}
  {{- if $gateway.annotations }}
  annotations:
    {{- toYaml $gateway.annotations | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gateway.gatewayClassName | default "istio-waypoint" }}
  {{- if $infrastructure.enabled }}
  infrastructure:
    parametersRef:
      group: {{ $parametersRef.group | default "" | quote }}
      kind: {{ $parametersRef.kind | default "ConfigMap" }}
      name: {{ $parametersRef.name | default (include "global-networking-policies.waypointConfigMapName" .) }}
  {{- end }}
  listeners:
    {{- toYaml ($gateway.listeners | default list) | nindent 4 }}
{{- end }}
