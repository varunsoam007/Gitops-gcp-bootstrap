# Chart Registry — Single source of truth for all vendored Helm charts
#
# Schema:
#   name:         Chart name (matches Chart.yaml `name` field)
#   directory:    Directory name under charts/ (includes version suffix)
#   version:      Currently vendored chart version
#   type:         "helm" (traditional repo) or "oci" (OCI registry)
#   repo:         Helm repo URL (type: helm) or OCI base URL without chart name (type: oci)
#   chart:        Chart name within the repo (may differ from `name`)
#   repoAlias:    Short alias for `helm repo add` (type: helm only)
#   localPatches: true if the chart has local modifications that must be re-applied on upgrade
#   patchNotes:   Description of local patches (when localPatches: true)
#   internal:     true if internally maintained (skipped during version checks)
#
# Adding a new chart:
#   1. Add an entry below with all required fields
#   2. Run: ./chart-downloader.sh --name <chart-name> [--version <version>]
#   3. Commit the new chart directory and this updated registry
#   4. For external charts, add the renovate comment on `version` or automated updates will not work

