apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: arm64-linux
  annotations:
    kubernetes.io/description: "ARM64 linux NodePool - DISABLED: no AKS images available in UK South"
spec:
  weight: 15  # Higher than generic-linux (10) to prefer ARM64
  template:
    spec:
      requirements:
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        # Bpsv2: ARM64 burstable series - waiting for AKS image support in UK South
        # All SKUs have minimum 8 GiB RAM
        - key: 
          operator: In
          values:
            - "Standard_B2ps_v2"   # 2 vCPU, 8 GiB RAM
            - "Standard_B4ps_v2"   # 4 vCPU, 16 GiB RAM
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["uksouth-1", "uksouth-2", "uksouth-3"]
      nodeClassRef:
        group: 
        kind: AKSNodeClass
        name: default
  limits:
    cpu: "0"  # DISABLED: Azure has no ARM64 AKS images in UK South region
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
