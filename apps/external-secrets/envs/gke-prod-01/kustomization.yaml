apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

resources:
  - namespace.yaml
  - gcp-cluster-secret-store.yaml

# ArgoCD will dynamically pull this Helm chart and inflate it using these values
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    releaseName: external-secrets
    version: 0.9.11
    namespace: external-secrets
    valuesInline:
      installCRDs: true
      serviceAccount:
        create: true
        name: "external-secrets-sa"
        annotations:
          # Binds this Kubernetes SA to our GCP Service Account via Workload Identity
          iam.gke.io/gcp-service-account: "external-secrets@project-c487c7e3-8780-4424-9ad.iam.gserviceaccount.com"
