# Argo Rollouts controller for Rollout/AnalysisTemplate support in devm.
installCRDs: true

dashboard:
  enabled: true
  readonly: true
  image:
    repository: argoproj/kubectl-argo-rollouts
    tag: v1.9.0
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      cpu: 15m
      memory: 100Mi
  nodeSelector: {}

providerRBAC:
  enabled: false

controller:
  replicas: 1
  image:
    repository: argoproj/argo-rollouts
    tag: v1.9.0
  logging:
    format: json
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      cpu: 15m
      memory: 100Mi
  nodeSelector: {}
