apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

helmCharts:
  - name: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    releaseName: argo-rollouts
    version: 2.41.0
    namespace: argo-rollouts
    includeCRDs: true
    additionalValuesFiles:
      - values-additional.yaml
