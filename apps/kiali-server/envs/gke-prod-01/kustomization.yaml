apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - httproute.yaml

helmGlobals:
  chartHome: ../../../../charts

namespace: istio-system
helmCharts:
  - name: kiali-server-2.15.0
    version: 2.15.0
    releaseName: kiali-server
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional.yaml
    namespace: istio-system
  - name: auth-templates-1.0.0
    version: 1.0.0
    releaseName: auth-templates
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional.yaml
    namespace: istio-system


