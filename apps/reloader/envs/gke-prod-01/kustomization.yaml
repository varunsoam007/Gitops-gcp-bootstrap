apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 1.0.121
    releaseName: reloader
    namespace: reloader
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional.yaml