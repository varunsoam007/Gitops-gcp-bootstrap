# Shared Testkube configuration for all environments
# ACR: crpinthirdpartymgtintuks001.azurecr.io

# Disable cloud/SaaS mode — fully self-hosted OSS
testkube-api:
  next:
    gitops:
      syncKubernetesToCloud: false
  analyticsEnabled: false
  cloud:
    key: ""
  uiIngress:
    enabled: false
  cliIngress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # ACR image overrides
  image:
    registry: crpinthirdpartymgtintuks001.azurecr.io
  imageTwToolkit:
    registry: crpinthirdpartymgtintuks001.azurecr.io
  imageTwInit:
    registry: crpinthirdpartymgtintuks001.azurecr.io
  minio:
    image:
      registry: crpinthirdpartymgtintuks001.azurecr.io

# NATS images — nats-server-config-reloader is in ACR
# NOTE: the main NATS server image (nats:2.10.9-alpine) must also be imported:
#   az acr import --name crpinthirdpartymgtintuks001 \
#     --source docker.io/library/nats:2.10.9-alpine --image nats:2.10.9-alpine
nats:
  container:
    image:
      registry: crpinthirdpartymgtintuks001.azurecr.io
  reloader:
    image:
      registry: crpinthirdpartymgtintuks001.azurecr.io

testkube-operator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  # ACR image overrides
  image:
    registry: crpinthirdpartymgtintuks001.azurecr.io
  # kube-rbac-proxy: imported as gcrioimages/kubebuilder-kube-rbac-proxy (different repo path in ACR)
  proxy:
    image:
      registry: crpinthirdpartymgtintuks001.azurecr.io
      repository: gcrioimages/kubebuilder-kube-rbac-proxy
  webhook:
    migrate:
      image:
        registry: crpinthirdpartymgtintuks001.azurecr.io
    # kube-webhook-certgen: imported without namespace prefix in ACR
    patch:
      image:
        registry: crpinthirdpartymgtintuks001.azurecr.io
        repository: kube-webhook-certgen
  preUpgrade:
    image:
      registry: crpinthirdpartymgtintuks001.azurecr.io
      repository: bitnami/kubectl
      tag: "sha256-393c457f5c410507a7718d7468d19fe53b4189ab06798df759605fb4aa22e474"

# testkube-logs is disabled by default (logsV2: false) but override for when enabled
testkube-logs:
  image:
    registry: crpinthirdpartymgtintuks001.azurecr.io


