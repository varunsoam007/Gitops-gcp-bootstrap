apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - kafka-cluster.yaml

commonAnnotations:
  argocd.argoproj.io/sync-options: ServerSideApply=true

patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
    patch: |-
      - op: remove
        path: /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties

helmGlobals:
  chartHome: ../../../../charts

helmCharts:
  - name: strimzi-kafka-operator-1.2.0
    includeCRDs: true
    version: 1.2.0
    releaseName: strimzi-cluster-operator
    namespace: strimzi-kafka
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional.yaml
