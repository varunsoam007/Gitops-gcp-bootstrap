
#==================================== 
# Environment configuration
#====================================
environment: "devm"
cluster: "k01"
domain: "jksoam.in"

# Gateway API CRDs
gatewayApi:
  enabled: true

#==================================== 
# External Gateway configuration
#====================================

externalGateway:
  enabled: true
  name: "shared-gateway-ext"

  # Azure Load Balancer configuration
  loadBalancer:
    ipv4: "10.64.69.4"
    resourceGroup: "rg-pin-aksshared-devm-int-uks-001"
    subnet: "snet-pin-aks-devm-int-uks-002"
 
  # External DNS configuration
  externalDns:
    target: "cfde-pin-fdr-devm-ext-uks-ingress-cxcnb3dgbzhjddcy.z01.azurefd.net" # Frontdoor alias name
  
  # TLS configuration
  tls:
    certificateRef: "wildcard-jksoam-in"


#==================================== 
# Internal Gateway configuration
#====================================

internalGateway:
  enabled: true
  name: "shared-gateway-int"

  # Azure Load Balancer configuration
  loadBalancer:
    ipv4: "10.64.69.5"
    resourceGroup: "rg-pin-aksshared-devm-int-uks-001"
    subnet: "snet-pin-aks-devm-int-uks-002"
  
  # TLS configuration
  tls:
    certificateRef: "wildcard-jksoam-in"
  
  # Hostname configuration for listeners
  hostname: "*.jksoam.in"


#==================================== 
# Certificate configuration
#====================================

certificates:
  - name: "wildcard-jksoam-in"
    secretName: "wildcard-jksoam-in"
    dnsNames:
      - "*.jksoam.in"
    issuerRef:
      name: "letsencrypt-prod-jksoam.in"
      kind: "ClusterIssuer"

  - name: "wildcard-jksoam-in"
    secretName: "wildcard-jksoam-in"
    dnsNames:
      - "*.jksoam.in"
    issuerRef:
      name: "letsencrypt-prod-jksoam.in"
      kind: "ClusterIssuer"


#====================================
# Deployment overrides
#====================================
gatewayOptions:
  external:
    data:
      deployment: |
        spec:
          template:
            spec:
              terminationGracePeriodSeconds: 30
              priorityClassName: observability-critical
              nodeSelector:
                kubernetes.azure.com/mode: user
                kubernetes.io/os: linux
              containers:
              - name: istio-proxy
                resources:
                  requests:
                    cpu: 15m
                    memory: 100Mi
                  limits:
                    cpu: 15m
                    memory: 100Mi

  internal:
    data:
      deployment: |
        spec:
          template:
            spec:
              terminationGracePeriodSeconds: 30
              priorityClassName: observability-critical
              nodeSelector:
                kubernetes.azure.com/mode: user
                kubernetes.io/os: linux
              containers:
              - name: istio-proxy
                resources:
                  requests:
                    cpu: 15m
                    memory: 105Mi
                  limits:
                    cpu: 15m
                    memory: 106Mi
  
  waypoint:
    data:
      deployment: |
        spec:
          template:
            spec:
              containers:
              - name: istio-proxy
                resources:
                  requests:
                    cpu: 23m
                    memory: 121Mi
                  limits:
                    cpu: 23m
                    memory: 122Mi
  
  waypointEgress:
    data:
      deployment: |
        spec:
          template:
            spec:
              containers:
              - name: istio-proxy
                resources:
                  requests:
                    cpu: 15m
                    memory: 100Mi
                  limits:
                    cpu: 15m
                    memory: 100Mi
