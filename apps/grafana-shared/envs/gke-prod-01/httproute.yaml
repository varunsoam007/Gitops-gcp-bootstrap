
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-shared
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  parentRefs:
  - name: shared-gateway-int
    namespace: gateway-api
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames: ["grafana.k01.devm.corp.pinpetuk.net"]
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana-service
      port: 3000
      kind: Service
      group: ''
      weight: 1
