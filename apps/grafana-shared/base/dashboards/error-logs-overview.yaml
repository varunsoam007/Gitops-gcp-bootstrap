          "panels": [],
          "title": "Error Overview",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "${lokidatasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 10 },
                  { "color": "red", "value": 100 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "10.0.0",
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${lokidatasource}" },
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(error|err|fatal|panic|exception)\" [$__range]))",
              "refId": "A"
            }
          ],
          "title": "Total Errors (Selected Range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "loki", "uid": "${lokidatasource}" },
