              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "# How to View Detailed CVE Information\n\nThis dashboard shows aggregated vulnerability counts. To view detailed CVE information including CVE IDs, descriptions, and links:\n\n## View All Vulnerability Reports\n```bash\nkubectl get vulnerabilityreports -A\n```\n\n## View Detailed CVEs for a Specific Resource\n```bash\n# Replace <namespace> and <report-name> with values from the tables above\nkubectl get vulnerabilityreports -n <namespace> <report-name> -o yaml\n```\n\n## Example: View Critical Vulnerabilities with CVE Links\n```bash\n# Get the first vulnerability report in monitoring namespace\nREPORT=$(kubectl get vulnerabilityreports -n monitoring -o name | head -1)\n\n# Extract Critical CVEs with links\nkubectl get $REPORT -n monitoring -o json | \\\n  jq -r '.report.vulnerabilities[] | select(.severity==\"CRITICAL\" or .severity==\"HIGH\") | \"\\(.vulnerabilityID) - \\(.title)\\n  Link: \\(.primaryLink)\\n  Score: \\(.score)\\n\"'\n```\n\n## Quick Command for Top Critical CVEs Cluster-Wide\n```bash\n# List all Critical/High CVEs across all namespaces\nkubectl get vulnerabilityreports -A -o json | \\\n  jq -r '.items[].report.vulnerabilities[] | select(.severity==\"CRITICAL\" or .severity==\"HIGH\") | [.vulnerabilityID, .severity, .score, .title, .primaryLink] | @tsv' | \\\n  sort -u | \\\n  column -t -s $'\\t'\n```\n\n## Filter by Image\n```bash\n# Find vulnerability reports for a specific image\nkubectl get vulnerabilityreports -A -o json | \\\n  jq -r '.items[] | select(.report.artifact.repository | contains(\"prometheus\")) | .metadata.namespace + \"/\" + .metadata.name'\n```\n\n**Note:** The primaryLink field in each CVE contains a direct link to the CVE database (NVD, Aqua Security, etc.)\n        ",
            "mode": "markdown"
          },
          "pluginVersion": "9.5.2",
          "title": "\ud83d\udccb How to View Detailed CVE Information",
          "type": "text"
        }
