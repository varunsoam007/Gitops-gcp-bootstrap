# CronJob to trigger Grafana pod rollout when referenced secrets change.
#
# Problem: Grafana Operator strictly reconciles the Deployment it creates,
# reverting any changes made by tools like Reloader. When secrets (e.g., database
# password) are rotated, pods continue running with stale credentials.
#
# Solution: This CronJob polls secret resourceVersions every 2 minutes. When a
# change is detected, it patches the Grafana CR with an updated annotation,
# triggering the operator to update the Deployment and roll out new pods.
#
# Secrets watched:
# - grafana-shared-user-secret: PostgreSQL database credentials (rotated by ESO)
# - grafana-shared: Grafana config from Azure Key Vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secret-sync
  namespace: grafana-shared
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-secret-sync
  namespace: grafana-shared
rules:
  # Read secrets to get resourceVersion
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - grafana-shared-user-secret
      - grafana-shared
  # Read and patch Grafana CR
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanas"]
    verbs: ["get", "patch"]
    resourceNames:
      - grafana
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-secret-sync
  namespace: grafana-shared
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-secret-sync
subjects:
  - kind: ServiceAccount
    name: grafana-secret-sync
    namespace: grafana-shared
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grafana-secret-sync
  namespace: grafana-shared
spec:
  schedule: "*/2 * * * *"  # Every 2 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        spec:
          serviceAccountName: grafana-secret-sync
          restartPolicy: Never
          nodeSelector:
            karpenter.sh/capacity-type: on-demand
          containers:
            - name: sync
              image: crpinthirdpartymgtintuks001.azurecr.io/alpine/k8s:1.35.2
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 64Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -e

                  NAMESPACE="grafana-shared"
                  GRAFANA_CR="grafana"
                  ANNOTATION_KEY="grafana.integreatly.org/secret-hash"

                  # Secrets to watch (space-separated)
                  SECRETS="grafana-shared-user-secret grafana-shared"

                  # Build hash input from all secret resourceVersions
                  HASH_INPUT=""
                  for SECRET in $SECRETS; do
                    RV=$(kubectl get secret "$SECRET" -n "$NAMESPACE" -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null || echo "missing")
                    HASH_INPUT="${HASH_INPUT}${SECRET}:${RV};"
                  done

                  # Compute short hash (first 16 chars of sha256)
                  NEW_HASH=$(echo -n "$HASH_INPUT" | sha256sum | cut -c1-16)

                  # Get current hash from Grafana CR annotation
                  # The annotation is at: spec.deployment.spec.template.metadata.annotations
                  # Use fully-qualified resource name to avoid conflict with grafanas.generators.external-secrets.io
                  CURRENT_HASH=$(kubectl get grafanas.grafana.integreatly.org "$GRAFANA_CR" -n "$NAMESPACE" \
                    -o jsonpath='{.spec.deployment.spec.template.metadata.annotations.grafana\.integreatly\.org/secret-hash}' 2>/dev/null || echo "")

                  # Compare and patch if different
                  if [ "$NEW_HASH" != "$CURRENT_HASH" ]; then
                    echo "Secret change detected. Old hash: '$CURRENT_HASH', New hash: '$NEW_HASH'"
                    echo "Input: $HASH_INPUT"
                    
                    # Patch the Grafana CR to trigger operator reconciliation
                    # The operator will update the Deployment, causing a rollout
                    # Use fully-qualified resource name to avoid conflict with grafanas.generators.external-secrets.io
                    kubectl patch grafanas.grafana.integreatly.org "$GRAFANA_CR" -n "$NAMESPACE" --type=json \
                      -p='[{"op": "add", "path": "/spec/deployment/spec/template/metadata/annotations/grafana.integreatly.org~1secret-hash", "value": "'"$NEW_HASH"'"}]'
                    
                    echo "Grafana CR patched. Operator will trigger pod rollout."
                  else
                    echo "No secret changes detected. Hash: $CURRENT_HASH"
                  fi
