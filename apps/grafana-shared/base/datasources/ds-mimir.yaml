apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir-gateway.mimir.svc.cluster.local:80/prometheus
    isDefault: true
    jsonData:
      tlsSkipVerify: true
      # match alloy scrape interval, 5s broke $__rate_interval on short panels (istio etc showed No data)
      timeInterval: "60s"
      httpMethod: POST
