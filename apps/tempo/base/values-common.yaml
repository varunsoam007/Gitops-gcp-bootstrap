# Shared Tempo configuration for all environments
# Environment-specific overrides go in envs/<env>/values-additional.yaml

global:
  priorityClassName: observability-critical
  # Enable ${ENV_VAR} expansion in Tempo config for GCS storage settings.
  # NOTE: the chart also applies global.extraArgs to memcached, which breaks it
  # (parsed as `-c` connection limit). The memcached StatefulSet strips these args
  # via a Kustomize patch in each env's kustomization.yaml.
  extraArgs:
    - -config.expand-env=true
  extraEnv:
    - name: TEMPO_GCS_BUCKET
      valueFrom:
        configMapKeyRef:
          name: tempo-gcs-config
          key: traces_bucket_name
  image:
    registry: docker.io

serviceAccount:
  create: true
  name: tempo
  automountServiceAccountToken: true
  annotations:
    iam.gke.io/gcp-service-account: tempo@project-c487c7e3-8780-4424-9ad.iam.gserviceaccount.com

reportingEnabled: false
multitenancyEnabled: false

minio:
  enabled: false

storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "${TEMPO_GCS_BUCKET}"

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

metaMonitoring:
  serviceMonitor:
    enabled: true

memcached:
  enabled: true
  image:
    repository: memcached

# Keep gateway disabled in devm baseline; query via query-frontend service.
gateway:
  enabled: false
