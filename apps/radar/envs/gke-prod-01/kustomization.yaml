apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - httproute.yaml

helmGlobals:
  chartHome: ../../../../charts

namespace: radar
helmCharts:
  - name: radar-1.5.10
    version: 1.5.10
    releaseName: radar
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional-radar.yaml
    namespace: radar
  - name: auth-templates-1.1.0
    version: 1.1.0
    releaseName: radar-auth-templates
    additionalValuesFiles:
      - values-additional.yaml
    namespace: radar
