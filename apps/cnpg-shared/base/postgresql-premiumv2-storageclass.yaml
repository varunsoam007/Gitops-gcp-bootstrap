apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgresql-premiumv2
# Using in-tree provisioner for backward compatibility with existing PVs
# Future clusters should use disk.csi.azure.com with IOPS/throughput settings
provisioner: kubernetes.io/azure-disk
parameters:
  kind: Managed
  skuName: PremiumV2_LRS
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
