apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - gcs-config.yaml

helmGlobals:
  chartHome: ../../../../charts

helmCharts:
  - name: loki-6.53.0
    includeCRDs: true
    version: 6.53.0
    releaseName: loki
    namespace: loki
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional.yaml
