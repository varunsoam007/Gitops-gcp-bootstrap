apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - azure-config.yaml

configMapGenerator:
  - name: external-config
    options:
      disableNameSuffixHash: true
    envs:
      - config.properties

replacements:
  # Replace workload identity client_id in ServiceAccount
  - source:
      kind: ConfigMap
      name: external-config
      fieldPath: data.client_id
    targets:
      - select:
          kind: ServiceAccount
          name: loki
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]

  # Populate the dedicated Azure storage ConfigMap (scalar fields only)
  - source:
      kind: ConfigMap
      name: external-config
      fieldPath: data.storage_account_name
    targets:
      - select:
          kind: ConfigMap
          name: loki-azure-config
        fieldPaths:
          - data.storage_account_name

  - source:
      kind: ConfigMap
      name: external-config
      fieldPath: data.chunks_container_name
    targets:
      - select:
          kind: ConfigMap
          name: loki-azure-config
        fieldPaths:
          - data.chunks_container_name

  - source:
      kind: ConfigMap
      name: external-config
      fieldPath: data.ruler_container_name
    targets:
      - select:
          kind: ConfigMap
          name: loki-azure-config
        fieldPaths:
          - data.ruler_container_name

helmGlobals:
  chartHome: ../../../../charts

helmCharts:
  - name: loki-6.53.0
    includeCRDs: true
    version: 6.53.0
    releaseName: loki
    namespace: loki
    additionalValuesFiles:
      - ../../base/values-common.yaml
      - values-additional.yaml
