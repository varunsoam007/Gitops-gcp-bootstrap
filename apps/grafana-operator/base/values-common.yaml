# Shared Grafana Operator configuration

# ACR third-party image
image:
  registry: ghcr.io
  repository: grafana-operator/grafana-operator

# Leader election is usually enabled by default in controller-runtime based operators,
# allowing us to run multiple replicas safely.
replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Use mutable CRDs for GitOps so CRD upgrades are rendered/applied consistently.
crds:
  immutable: false
