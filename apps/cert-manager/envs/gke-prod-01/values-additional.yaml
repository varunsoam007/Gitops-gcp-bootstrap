crds:
  enabled: true

# Resources: req==lim per Tim Hockin pattern (VPA upper: ~128Mi all components)
resources:
  requests:
    cpu: 15m
    memory: 100Mi
  limits:
    cpu: 15m
    memory: 100Mi

nodeSelector:
  karpenter.sh/capacity-type: on-demand

cainjector:
  enabled: true
  resources:
    requests:
      cpu: 15m
      memory: 139Mi
    limits:
      cpu: 15m
      memory: 139Mi
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

webhook:
  resources:
    requests:
      cpu: 15m
      memory: 100Mi
    limits:
      cpu: 15m
      memory: 100Mi
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

startupapicheck:
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

podLabels:
  azure.workload.identity/use: "true"

serviceAccount:
  name: cert-manager
  annotations:
    azure.workload.identity/client-id: da3953b0-36aa-4085-8102-6e758e33c52a

extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
