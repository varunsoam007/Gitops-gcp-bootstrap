apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-jksoam.in
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@jksoam.in
    privateKeySecretRef:
      name: letsencrypt-prod-jksoam.in
    solvers:
    - dns01:
        cloudDNS:
          project: project-c487c7e3-8780-4424-9ad
          serviceAccountSecretRef:
            name: cert-manager-dns-key
            key: key.json
