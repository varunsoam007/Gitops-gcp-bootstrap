# Curated PromQL alerting rules for Mimir ruler
# Evaluated by Mimir ruler -> Mimir Alertmanager -> prometheus-msteams -> Teams
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-ruler-rules
  labels:
    app.kubernetes.io/component: ruler-rules
data:
  # --- Kubernetes / kube-state-metrics alerts ---
  kubernetes.yaml: |
    groups:
      - name: kubernetes-nodes
        rules:
          - alert: KubernetesNodeNotReady
            expr: 'max by (cluster, node) (kube_node_status_condition{condition="Ready",status="true"}) == 0'
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} not ready"
              description: "Node {{ $labels.node }} has been unready for over 10 minutes."

          - alert: KubernetesNodeMemoryPressure
            expr: 'max by (cluster, node) (kube_node_status_condition{condition="MemoryPressure",status="true"}) == 1'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} memory pressure"
              description: "Node {{ $labels.node }} has MemoryPressure condition."

          - alert: KubernetesNodeDiskPressure
            expr: 'max by (cluster, node) (kube_node_status_condition{condition="DiskPressure",status="true"}) == 1'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} disk pressure"
              description: "Node {{ $labels.node }} has DiskPressure condition."

          - alert: KubernetesNodeNetworkUnavailable
            expr: 'max by (cluster, node) (kube_node_status_condition{condition="NetworkUnavailable",status="true"}) == 1'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} network unavailable"
              description: "Node {{ $labels.node }} has NetworkUnavailable condition."

          - alert: KubernetesNodeOutOfPodCapacity
            expr: >-
              count by (cluster, node) (kube_pod_info)
              / max by (cluster, node) (kube_node_status_allocatable{resource="pods"}) * 100 > 90
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.node }} out of pod capacity"
              description: "Node {{ $labels.node }} is using over 90% of pod capacity."

      - name: kubernetes-pods
        rules:
          - alert: KubernetesContainerOomKiller
            expr: >-
              (max by (cluster, exported_namespace, namespace, pod, container)
                (kube_pod_container_status_restarts_total -
                 kube_pod_container_status_restarts_total offset 10m) >= 1)
              and on (cluster, exported_namespace, namespace, pod, container)
              (max by (cluster, exported_namespace, namespace, pod, container)
                (min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m])) == 1)
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.container }} OOM killed"
              description: "Container {{ $labels.container }} in {{ $labels.exported_namespace }}/{{ $labels.pod }} has been OOMKilled in the last 10m."

          - alert: KubernetesPodCrashLooping
            expr: >-
              max by (cluster, exported_namespace, namespace, pod, container)
              (increase(kube_pod_container_status_restarts_total[15m])) > 5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.exported_namespace }}/{{ $labels.pod }} crash looping"
              description: "Pod {{ $labels.exported_namespace }}/{{ $labels.pod }} has restarted more than 5 times in 15 minutes."

      - name: kubernetes-workloads
        rules:
          - alert: KubernetesDeploymentReplicasMismatch
            expr: >-
              max by (cluster, exported_namespace, deployment) (kube_deployment_spec_replicas)
              !=
              max by (cluster, exported_namespace, deployment) (kube_deployment_status_replicas_available)
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.exported_namespace }}/{{ $labels.deployment }} replicas mismatch"
              description: "Deployment {{ $labels.exported_namespace }}/{{ $labels.deployment }} has mismatched replicas for over 30 minutes."

          - alert: KubernetesStatefulsetDown
            expr: >-
              (
              max by (cluster, exported_namespace, statefulset) (kube_statefulset_replicas)
              !=
              max by (cluster, exported_namespace, statefulset) (kube_statefulset_status_replicas_ready)
              ) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "StatefulSet {{ $labels.exported_namespace }}/{{ $labels.statefulset }} down"
              description: "StatefulSet {{ $labels.exported_namespace }}/{{ $labels.statefulset }} has mismatched ready replicas for over 15 minutes."

          - alert: KubernetesStatefulsetReplicasMismatch
            expr: >-
              max by (cluster, exported_namespace, statefulset) (kube_statefulset_status_replicas_ready)
              !=
              max by (cluster, exported_namespace, statefulset) (kube_statefulset_status_replicas)
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "StatefulSet {{ $labels.exported_namespace }}/{{ $labels.statefulset }} replicas mismatch"
              description: "StatefulSet does not match the expected number of replicas."

          - alert: KubernetesDaemonsetRolloutStuck
            expr: >-
              (max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_number_ready)
              / max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_desired_number_scheduled) * 100 < 100
              and max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_desired_number_scheduled) > 0)
              or max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_desired_number_scheduled)
              - max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_current_number_scheduled) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "DaemonSet {{ $labels.exported_namespace }}/{{ $labels.daemonset }} rollout stuck"
              description: "Some Pods of DaemonSet {{ $labels.exported_namespace }}/{{ $labels.daemonset }} are not scheduled or not ready."

          - alert: KubernetesDaemonsetMisscheduled
            expr: >-
              max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_number_misscheduled) > 0
              unless on (cluster, exported_namespace, daemonset)
              (max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_number_ready)
                < max by (cluster, exported_namespace, daemonset) (kube_daemonset_status_desired_number_scheduled))
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "DaemonSet {{ $labels.exported_namespace }}/{{ $labels.daemonset }} misscheduled"
              description: "Some Pods of DaemonSet {{ $labels.exported_namespace }}/{{ $labels.daemonset }} are running where they shouldn't be."

      - name: kubernetes-jobs
        rules:
          - alert: KubernetesJobFailed
            expr: >-
              max by (cluster, exported_namespace, job_name) (kube_job_status_failed) > 0
              and on(cluster, exported_namespace, job_name)
              (time() - max by (cluster, exported_namespace, job_name) (kube_job_created) < 21600)
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Job {{ $labels.exported_namespace }}/{{ $labels.job_name }} failed"
              description: "Job {{ $labels.exported_namespace }}/{{ $labels.job_name }} failed to complete."

          - alert: KubernetesCronjobFailing
            expr: >-
              (max by (cluster, exported_namespace, cronjob) (kube_cronjob_status_last_schedule_time)
              > max by (cluster, exported_namespace, cronjob) (kube_cronjob_status_last_successful_time))
              AND (max by (cluster, exported_namespace, cronjob) (kube_cronjob_status_active) == 0)
              AND (max by (cluster, exported_namespace, cronjob) (kube_cronjob_spec_suspend) == 0)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "CronJob {{ $labels.exported_namespace }}/{{ $labels.cronjob }} failing"
              description: "CronJob {{ $labels.exported_namespace }}/{{ $labels.cronjob }} is failing."

      - name: kubernetes-storage
        rules:
          - alert: KubernetesPersistentvolumeclaimPending
            expr: 'max by (cluster, exported_namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_status_phase{phase="Pending"}) == 1'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.exported_namespace }}/{{ $labels.persistentvolumeclaim }} pending"
              description: "PVC {{ $labels.exported_namespace }}/{{ $labels.persistentvolumeclaim }} is pending."

          - alert: KubernetesPersistentvolumeError
            expr: 'max by (cluster, persistentvolume, phase) (kube_persistentvolume_status_phase{phase=~"Failed|Pending"}) > 0'
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "PersistentVolume {{ $labels.persistentvolume }} error"
              description: "PersistentVolume {{ $labels.persistentvolume }} is in {{ $labels.phase }} state."

          - alert: KubernetesVolumeOutOfDiskSpace
            # bump for: 2m -> 10m, dedup per volume
            expr: >-
              max by (cluster, namespace, persistentvolumeclaim, node)
              (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100) < 10
              and max by (cluster, namespace, persistentvolumeclaim, node) (kubelet_volume_stats_capacity_bytes) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Volume almost full (< 10% left)"
              description: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is almost full (< 10% available)."

      - name: kubernetes-apiserver
        rules:
          - alert: KubernetesApiServerErrors
            expr: >-
              sum by (cluster, instance, job) (rate(apiserver_request_total{job="apiserver",code=~"(?:5..)"}[1m]))
              / sum by (cluster, instance, job) (rate(apiserver_request_total{job="apiserver"}[1m])) * 100 > 3
              and sum by (cluster, instance, job) (rate(apiserver_request_total{job="apiserver"}[1m])) > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Kubernetes API server errors"
              description: "Kubernetes API server is experiencing {{ $value | humanize }}% error rate."

          - alert: KubernetesApiClientErrors
            expr: >-
              (sum by (cluster, instance, job) (rate(rest_client_requests_total{code=~"(4|5).."}[1m]))
              / sum by (cluster, instance, job) (rate(rest_client_requests_total[1m]))) * 100 > 1
              and sum by (cluster, instance, job) (rate(rest_client_requests_total[1m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Kubernetes API client errors"
              description: "Kubernetes API client is experiencing {{ $value | humanize }}% error rate."

          - alert: KubernetesApiServerLatency
            expr: >-
              histogram_quantile(0.99,
                sum by (cluster, le, verb, resource)
                  (rate(apiserver_request_duration_seconds_bucket{verb!~"(?:CONNECT|WATCHLIST|WATCH|PROXY|LIST)"}[10m]))
              ) > 10
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Kubernetes API server latency"
              description: "Kubernetes API server has a 99th percentile latency of {{ $value }}s for {{ $labels.verb }} {{ $labels.resource }}."

  # --- cert-manager alerts ---
  cert-manager.yaml: |
    groups:
      - name: cert-manager
        rules:
          - alert: CertManagerCertExpiringSoon
            expr: >-
              avg by (cluster, exported_namespace, namespace, name)
              (certmanager_certificate_expiration_timestamp_seconds - time()) < (21 * 24 * 3600)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ $labels.name }} expiring soon"
              description: "Certificate {{ $labels.name }} in {{ $labels.exported_namespace }} is expiring in less than 21 days."

          - alert: CertManagerCertNotReady
            expr: >-
              max by (cluster, name, exported_namespace, namespace, condition)
              (certmanager_certificate_ready_status{condition!="True"} == 1)
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Certificate {{ $labels.name }} not ready"
              description: "Certificate {{ $labels.name }} in {{ $labels.exported_namespace }} is not ready to serve traffic."

          - alert: CertManagerHittingRateLimits
            expr: 'sum by (cluster, host) (rate(certmanager_acme_client_request_count{status="429"}[5m])) > 0'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "cert-manager hitting ACME rate limits"
              description: "cert-manager is being rate-limited by the ACME provider. Issuance/renewal may be blocked."

  # --- ArgoCD alerts ---
  argocd.yaml: |
    groups:
      - name: argocd
        rules:
          - alert: ArgocdServiceNotSynced
            expr: 'max by (cluster, name, namespace, dest_namespace, project) (argocd_app_info{sync_status!="Synced"}) != 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ $labels.name }} not synced"
              description: "ArgoCD application {{ $labels.name }} has been out of sync for over 15 minutes."

          - alert: ArgocdServiceUnhealthy
            expr: 'max by (cluster, name, namespace, dest_namespace, project) (argocd_app_info{health_status!="Healthy"}) != 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ $labels.name }} unhealthy"
              description: "ArgoCD application {{ $labels.name }} has been unhealthy for over 15 minutes."

  # --- CoreDNS alerts ---
  coredns.yaml: |
    groups:
      - name: coredns
        rules:
          - alert: CorednsPanicCount
            expr: 'sum by (cluster, namespace, pod) (increase(coredns_panics_total[5m])) > 0'
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "CoreDNS panic detected"
              description: "CoreDNS has encountered a panic. DNS resolution may be impaired."

  # --- Grafana Alloy alerts ---
  alloy.yaml: |
    groups:
      - name: grafana-alloy
        rules:
          - alert: AlloyUnhealthyComponents
            expr: 'max by (cluster, namespace, pod, controller_path) (alloy_component_controller_running_components{health_type="unhealthy"}) > 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Alloy has unhealthy components on {{ $labels.pod }}"
              description: "Alloy components on {{ $labels.cluster }}/{{ $labels.namespace }} have been reporting unhealthy status for over 15 minutes. Pod: {{ $labels.pod }}, controller path: {{ $labels.controller_path }}."

          - alert: AlloySlowComponentEvaluations
            expr: 'sum by (cluster, namespace, job, component_path, component_id) (rate(alloy_component_evaluation_slow_seconds[10m])) > 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Alloy component evaluations are slow ({{ $labels.component_id }})"
              description: "Component {{ $labels.component_id }} (path {{ $labels.component_path }}) on {{ $labels.cluster }} is taking too long to evaluate. Usually a sign of slow upstream (scrape target, file I/O) or a config bug."

          - alert: AlloyRemoteWriteFailures
            expr: |
              (
                sum by (cluster, namespace, pod, url) (rate(prometheus_remote_storage_samples_failed_total[5m]))
                /
                sum by (cluster, namespace, pod, url) (rate(prometheus_remote_storage_samples_total[5m]))
              ) > 0.01
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alloy remote-write failing to {{ $labels.url }}"
              description: "More than 1% of samples from {{ $labels.pod }} are failing to reach {{ $labels.url }}. Mimir may be rejecting writes (limits, auth) or unreachable."

          - alert: AlloyRemoteWriteBehind
            # WAL backing up - Alloy can't keep up with shipping samples
            expr: 'max by (cluster, namespace, pod, url) (prometheus_remote_storage_samples_pending) > 20000'
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alloy remote-write backlog growing ({{ $labels.url }})"
              description: "Alloy {{ $labels.pod }} has {{ $value }} pending samples queued for {{ $labels.url }}. Ingestion endpoint is too slow or Alloy is under-provisioned."

          - alert: AlloyRemoteWriteStalled
            # If last successful send is too old, backlog is aging toward rejection window.
            expr: 'max by (cluster, namespace, pod, url) (time() - prometheus_remote_storage_queue_highest_sent_timestamp_seconds) > 600'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alloy remote-write stalled ({{ $labels.url }})"
              description: "Alloy {{ $labels.pod }} has not successfully shipped samples to {{ $labels.url }} for over 10 minutes. Fix write path now to avoid old-sample drops."

          - alert: AlloyRemoteWriteDroppingSamples
            expr: 'sum by (cluster, namespace, pod, url) (rate(prometheus_remote_storage_samples_dropped_total[5m])) > 0'
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alloy dropping samples on remote-write ({{ $labels.url }})"
              description: "Alloy {{ $labels.pod }} is dropping samples destined for {{ $labels.url }}. Usually WAL full or shards overwhelmed - data loss in progress."

          - alert: AlloyScrapeTargetsCollapsed
            expr: |
              (
                sum by (cluster, namespace) (prometheus_target_scrape_pool_targets)
                /
                clamp_min(max_over_time(sum by (cluster, namespace) (prometheus_target_scrape_pool_targets)[1h:1m]), 1)
              ) < 0.7
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alloy scrape targets collapsed on {{ $labels.cluster }}/{{ $labels.namespace }}"
              description: "Active scrape targets dropped below 70% of the 1h peak for over 10m. This can create visible metric gaps and usually indicates discovery/watch instability or widespread endpoint loss."

          - alert: AlloyRemoteWriteLagHigh
            expr: |
              quantile by (cluster, namespace) (
                0.95,
                time() - prometheus_remote_storage_queue_highest_sent_timestamp_seconds
              ) > 120
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Alloy remote-write lag high on {{ $labels.cluster }}/{{ $labels.namespace }}"
              description: "p95 remote-write send lag has been over 120s for 10m. Metrics are delayed and may show gaps/staleness in dashboards during sustained backlog."

  # --- Loki self-monitoring ---
  loki.yaml: |
    groups:
      - name: loki
        rules:
          - alert: LokiRequestErrors
            expr: |
              100 * sum by (cluster, namespace, job, route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m]))
              /
              sum by (cluster, namespace, job, route) (rate(loki_request_duration_seconds_count[5m]))
              > 10
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Loki {{ $labels.job }} {{ $labels.route }} >10% 5xx"
              description: "Route {{ $labels.route }} is returning {{ printf \"%.2f\" $value }}% errors."

          - alert: LokiRequestPanics
            expr: 'sum by (cluster, namespace, job) (increase(loki_panic_total[10m])) > 0'
            labels:
              severity: critical
            annotations:
              summary: "Loki {{ $labels.job }} panicked"
              description: "Loki code panic detected in {{ $labels.job }} - likely a crash loop."

          - alert: LokiTooManyCompactorsRunning
            expr: 'sum by (cluster, namespace) (loki_boltdb_shipper_compactor_running) > 1'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Loki has more than one compactor running"
              description: "Only one compactor should run at a time. Multiple will race on the index."

          - alert: LokiCompactorHasNotSuccessfullyRunCompaction
            expr: |
              min by (cluster, namespace) (
                time() - (loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds > 0)
              ) > 60 * 60 * 3
            for: 1h
            labels:
              severity: critical
            annotations:
              summary: "Loki compactor hasn't run successfully in 3h"
              description: "Index compaction has not completed in {{ $labels.cluster }}/{{ $labels.namespace }} for 3+ hours."

  # --- CloudNativePG (Postgres clusters) ---
  cnpg.yaml: |
    groups:
      - name: cnpg
        rules:
          - alert: CNPGReplicationLag
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_pg_replication_lag) > 300'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CNPG standby {{ $labels.pod }} lagging >5m"
              description: "Replica {{ $labels.pod }} is {{ $value }}s behind the primary."

          - alert: CNPGReplicaFailingReplication
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up) > 0'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "CNPG replica {{ $labels.pod }} not replicating"
              description: "Replica is in recovery but WAL receiver is down - replication broken."

          - alert: CNPGArchiveFailing
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "CNPG WAL archive failing on {{ $labels.pod }}"
              description: "Last WAL archive attempt failed more recently than the last successful one. Backups / PITR at risk."

          - alert: CNPGLongRunningTransaction
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_backends_max_tx_duration_seconds) > 300'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CNPG long-running transaction on {{ $labels.pod }}"
              description: "A query has been open for more than 5 minutes. Can block VACUUM and hold locks."

          - alert: CNPGBackendsWaiting
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_backends_waiting_total) > 300'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CNPG backends waiting on locks ({{ $labels.pod }})"
              description: "More than 300 backends have been waiting for locks for >5m."

          - alert: CNPGXidAge
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_pg_database_xid_age) > 300000000'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CNPG transaction ID age high on {{ $labels.pod }}"
              description: "XID age >300M - wraparound risk. Autovacuum may be behind."

          - alert: CNPGDatabaseDeadlocks
            expr: 'max by (cluster, exported_namespace, namespace, pod) (cnpg_pg_stat_database_deadlocks) > 10'
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CNPG deadlock conflicts on {{ $labels.pod }}"
              description: "More than 10 deadlock conflicts detected - application lock ordering issue."

  # --- Istio (service mesh) ---
  istio.yaml: |
    groups:
      - name: istio
        rules:
          - alert: IstioHigh5xxRate
            expr: |
              (
                sum by (cluster, destination_workload_namespace, destination_workload) (rate(istio_requests_total{reporter="waypoint", destination_workload!="unknown", destination_workload_namespace!="unknown", response_code=~"5.."}[15m]))
                /
                clamp_min(sum by (cluster, destination_workload_namespace, destination_workload) (rate(istio_requests_total{reporter="waypoint", destination_workload!="unknown", destination_workload_namespace!="unknown"}[15m])), 0.001)
              ) > 0.05
              and
              sum by (cluster, destination_workload_namespace, destination_workload) (rate(istio_requests_total{reporter="waypoint", destination_workload!="unknown", destination_workload_namespace!="unknown"}[15m])) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Istio workload {{ $labels.destination_workload }} >5% 5xx"
              description: "{{ $labels.destination_workload_namespace }}/{{ $labels.destination_workload }} is returning >5% 5xx responses over 15m with sustained traffic (>0.1 req/s), as reported by waypoint proxy telemetry."

          - alert: IstioHighLatency
            expr: |
              histogram_quantile(0.99,
                sum by (cluster, destination_workload_namespace, destination_workload, le) (rate(istio_request_duration_milliseconds_bucket{reporter="waypoint", destination_workload!="unknown", destination_workload_namespace!="unknown"}[15m]))
              ) > 5000
              and
              sum by (cluster, destination_workload_namespace, destination_workload) (rate(istio_requests_total{reporter="waypoint", destination_workload!="unknown", destination_workload_namespace!="unknown"}[15m])) > 0.1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Istio workload {{ $labels.destination_workload }} p99 latency >5s"
              description: "{{ $labels.destination_workload_namespace }}/{{ $labels.destination_workload }} p99 request latency is over 5 seconds with sustained traffic (>0.1 req/s), based on waypoint telemetry over 15m."

          - alert: IstioPilotPushErrors
            expr: |
              sum by (cluster, namespace) (increase(pilot_xds_expired_nonce[30m]))
              /
              clamp_min(sum by (cluster, namespace) (increase(pilot_xds_pushes[30m])), 1)
              > 0.01
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Istiod xDS nonce expiry elevated"
              description: "Over 1% of xDS push attempts in the last 30m ended up as expired nonce events. Proxies may be lagging or cycling and can receive stale config."

          - alert: IstiodDown
            expr: 'absent(up{namespace="istio-system",app="istiod"} == 1) or sum(up{namespace="istio-system",app="istiod"}) == 0'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Istiod control plane down"
              description: "No istiod replicas are reporting up. ztunnel and waypoint proxies cannot get config."

  # --- External-Secrets Operator ---
  external-secrets.yaml: |
    groups:
      - name: external-secrets
        rules:
          - alert: ExternalSecretNotReady
            expr: 'max by (cluster, exported_namespace, namespace, name) (externalsecret_status_condition{condition="Ready", status="False"}) > 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ExternalSecret {{ $labels.name }} not ready"
              description: "ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} has had Ready=False for >15m. Secret contents likely stale."

          - alert: ExternalSecretSyncErrors
            expr: 'sum by (cluster, exported_namespace, namespace, name) (rate(externalsecret_sync_calls_error[10m])) > 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ExternalSecret {{ $labels.name }} sync errors"
              description: "{{ $labels.exported_namespace }}/{{ $labels.name }} has been throwing sync errors for 15m."

  # --- Karpenter (node provisioning) ---
  karpenter.yaml: |
    groups:
      - name: karpenter
        rules:
          - alert: KarpenterNodePoolNearLimit
            expr: 'max by (cluster, nodepool, resource_type) (karpenter_nodepools_usage / karpenter_nodepools_limit) > 0.9'
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Karpenter NodePool {{ $labels.nodepool }} >90% {{ $labels.resource_type }}"
              description: "NodePool is close to its limit - new pods may become unschedulable."

          - alert: KarpenterDisruptionQueueBacklog
            expr: 'max by (cluster) (karpenter_disruption_queue_depth) > 0'
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Karpenter disruption queue backed up"
              description: "Disruption queue has had pending items for >30m. Consolidation / expiry not progressing."

          - alert: KarpenterNodePoolErrors
            expr: 'sum by (cluster, nodepool, reason) (rate(karpenter_nodeclaims_disrupted_total{reason!~"consolidation|expiration|drift|empty|underutilized"}[15m])) > 0'
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Karpenter nodeclaims disrupted unexpectedly ({{ $labels.reason }})"
              description: "NodeClaims on nodepool {{ $labels.nodepool }} are being disrupted for reason `{{ $labels.reason }}` - investigate (interruption, health, etc)."

          - alert: KarpenterControllerDown
            expr: 'absent_over_time(up{job="karpenter"}[5m]) or sum(up{job="karpenter"}) == 0'
            for: 10m
            labels:
              severity: critical
              namespace: karpenter
              pod: karpenter
            annotations:
              summary: "Karpenter controller down"
              description: "Karpenter is not running - no new nodes can be provisioned and no disruptions will happen."

  # --- Spot Node Evictions ---
  spot-evictions.yaml: |
    groups:
      - name: spot-evictions
        rules:
          - alert: SpotNodeEvicted
            expr: |
              (
                max by (cluster, node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
              )
              * on (cluster, node) group_left()
              max by (cluster, node) (kube_node_labels{label_karpenter_sh_nodepool=~".+spot.*"})
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Spot node {{ $labels.node }} evicted ({{ $labels.cluster }})"
              description: "Spot node {{ $labels.node }} has been evicted and is NotReady. All pods scheduled on this node have been terminated and will be rescheduled. Check the DeploymentFullyDown / DeploymentDegraded alerts for affected workloads."

          - alert: DeploymentFullyDown
            expr: |
              (
                max by (cluster, exported_namespace, deployment) (
                  kube_deployment_status_replicas_available
                ) == 0
              )
              and on (cluster, exported_namespace, deployment)
              (
                max by (cluster, exported_namespace, deployment) (
                  kube_deployment_spec_replicas
                ) > 0
              )
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.exported_namespace }}/{{ $labels.deployment }} fully down ({{ $labels.cluster }})"
              description: "{{ $labels.exported_namespace }}/{{ $labels.deployment }} has 0 available replicas — service is completely down. Desired replica count is > 0. Likely caused by spot node eviction."

          - alert: DeploymentDegraded
            expr: |
              (
                max by (cluster, exported_namespace, deployment) (
                  kube_deployment_status_replicas_available
                )
                < on (cluster, exported_namespace, deployment)
                max by (cluster, exported_namespace, deployment) (
                  kube_deployment_spec_replicas
                )
              ) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.exported_namespace }}/{{ $labels.deployment }} degraded ({{ $labels.cluster }})"
              description: "{{ $labels.exported_namespace }}/{{ $labels.deployment }} has {{ $value | humanize }} available replicas — fewer than desired. Partial outage. May be caused by spot node eviction."
          - alert: EvictedPodsNotCleaned
            expr: |
              sum by (cluster, exported_namespace) (
                kube_pod_status_reason{reason="Evicted"} == 1
              ) > 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Evicted pods not cleaned up on {{ $labels.cluster }}"
              description: "{{ $value }} evicted pod object(s) in {{ $labels.exported_namespace }} on {{ $labels.cluster }} have not been deleted for >30m. Clean up with: kubectl delete pods -n {{ $labels.exported_namespace }} --field-selector=status.phase=Failed"

  # --- Mimir dashboard recording rules (official mixin compatibility) ---
  mimir-dashboard-recording-rules.yaml: |
    groups:
      - name: mimir-dashboard-recording-rules
        interval: 1m
        rules:
          - record: cluster_job_route:cortex_request_duration_seconds_bucket:sum_rate
            expr: |
              sum by (cluster, job, route, le) (
                rate(cortex_request_duration_seconds_bucket[5m])
              )

          - record: cluster_job_route:cortex_request_duration_seconds_sum:sum_rate
            expr: |
              sum by (cluster, job, route) (
                rate(cortex_request_duration_seconds_sum[5m])
              )

          - record: cluster_job_route:cortex_request_duration_seconds_count:sum_rate
            expr: |
              sum by (cluster, job, route) (
                rate(cortex_request_duration_seconds_count[5m])
              )

          - record: cluster_job_route:cortex_request_duration_seconds:sum_rate
            expr: |
              sum by (cluster, job, route) (
                rate(cortex_request_duration_seconds[5m])
              )

  # --- Official Grafana Mimir compiled alerts (mimir-mixin-compiled) ---
  mimir-official-alerts.yaml: |
    groups:
        - name: mimir_alerts
          rules:
            - alert: MimirIngesterUnhealthy
              annotations:
                message: Mimir cluster {{ $labels.cluster }}/{{ $labels.namespace }} has {{ printf "%f" $value }} unhealthy ingester(s).
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterunhealthy
              expr: |
                min by (cluster, namespace) (cortex_ring_members{state="Unhealthy", name="ingester"}) > 0
              for: 15m
              labels:
                severity: critical
            - alert: MimirRequestErrors
              annotations:
                message: |
                    The route {{ $labels.route }} in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% errors.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrequesterrors
              expr: |
                # The following 5xx errors considered as non-error:
                # - 529: used by distributor rate limiting (using 529 instead of 429 to let the client retry)
                # - 598: used by GEM gateway when the client is very slow to send the request and the gateway times out reading the request body
                (
                  sum by (cluster, namespace, job, route) (rate(cortex_request_duration_seconds_count{status_code=~"5..", status_code!~"529|598", route!~"ready|debug_pprof"}[4m]))
                  /
                  sum by (cluster, namespace, job, route) (rate(cortex_request_duration_seconds_count{route!~"ready|debug_pprof"}[4m]))
                ) * 100 > 1
              for: 15m
              labels:
                histogram: classic
                severity: critical
            - alert: MimirRequestErrors
              annotations:
                message: |
                    The route {{ $labels.route }} in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% errors.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrequesterrors
              expr: |
                # The following 5xx errors considered as non-error:
                # - 529: used by distributor rate limiting (using 529 instead of 429 to let the client retry)
                # - 598: used by GEM gateway when the client is very slow to send the request and the gateway times out reading the request body
                (
                  sum by (cluster, namespace, job, route) (histogram_count(rate(cortex_request_duration_seconds{status_code=~"5..", status_code!~"529|598", route!~"ready|debug_pprof"}[4m])))
                  /
                  sum by (cluster, namespace, job, route) (histogram_count(rate(cortex_request_duration_seconds{route!~"ready|debug_pprof"}[4m])))
                ) * 100 > 1
              for: 15m
              labels:
                histogram: native
                severity: critical
            - alert: MimirRequestLatency
              annotations:
                message: |
                    {{ $labels.job }} {{ $labels.route }} is experiencing {{ printf "%.2f" $value }}s 99th percentile latency.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrequestlatency
              expr: |
                cluster_namespace_job_route:cortex_request_duration_seconds:99quantile{route!~"metrics|/frontend.Frontend/Process|ready|/schedulerpb.SchedulerForFrontend/FrontendLoop|/schedulerpb.SchedulerForQuerier/QuerierLoop|debug_pprof"}
                  >
                2.5
              for: 15m
              labels:
                histogram: classic
                severity: warning
            - alert: MimirRequestLatency
              annotations:
                message: |
                    {{ $labels.job }} {{ $labels.route }} is experiencing {{ printf "%.2f" $value }}s 99th percentile latency.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrequestlatency
              expr: |
                histogram_quantile(0.99, cluster_namespace_job_route:cortex_request_duration_seconds:sum_rate{route!~"metrics|/frontend.Frontend/Process|ready|/schedulerpb.SchedulerForFrontend/FrontendLoop|/schedulerpb.SchedulerForQuerier/QuerierLoop|debug_pprof"})
                  >
                2.5
              for: 15m
              labels:
                histogram: native
                severity: warning
            - alert: MimirInconsistentRuntimeConfig
              annotations:
                message: |
                    An inconsistent runtime config file is used across cluster {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirinconsistentruntimeconfig
              expr: |
                count without(sha256) (
                    count by (cluster, namespace, job, sha256) (cortex_runtime_config_hash)
                    unless on (cluster, namespace, sha256)
                    # Don't include config hashes that are still being rolled out.
                    # Kubernetes configmap propagation can be slow,
                    # and in large cells we may deploy a new configmap when the previous one isn't still propagated everywhere.
                    (changes((count by (cluster, namespace, sha256) (cortex_runtime_config_hash))[10m:1m]) > 0)
                    # Don't include configs that didn't exist one minute ago.
                    # changes() == 0 for metrics appearing for the first time,
                    # but this is still a "we're rolling out a new config" scenario.
                    and on (cluster, namespace, sha256)
                    group by (cluster, namespace, sha256) (cortex_runtime_config_hash offset 1m)
                )  > 1
              for: 1h
              labels:
                severity: critical
            - alert: MimirBadRuntimeConfig
              annotations:
                message: |
                    {{ $labels.job }} failed to reload runtime config.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirbadruntimeconfig
              expr: |
                # The metric value is reset to 0 on error while reloading the config at runtime.
                cortex_runtime_config_last_reload_successful == 0
              for: 5m
              labels:
                severity: critical
            - alert: MimirBlockedQueryRuleExpired
              annotations:
                message: |
                    At least one blocked_queries rule for tenant {{ $labels.user }} in cluster {{ $labels.cluster }}/{{ $labels.namespace }}
                    has an expires_at that already passed (earliest: {{ $value | humanizeTimestamp }}). Affected rules are
                    still being enforced: expiry is informational only and does not disable them. Check the tenant's
                    blocked_queries configuration and remove or renew any rule that's no longer needed.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockedqueryruleexpired
              expr: |
                # min() picks the earliest expiry among the tenant's blocked_queries rules, so this fires as soon as
                # any one of them has expired, and keeps firing (with a moving threshold) until they're all addressed.
                min by (cluster, namespace, user) (cortex_blocked_query_rule_expires_at) < time()
              for: 15m
              labels:
                severity: warning
            - alert: MimirLimitedQueryRuleExpired
              annotations:
                message: |
                    At least one limited_queries rule for tenant {{ $labels.user }} in cluster {{ $labels.cluster }}/{{ $labels.namespace }}
                    has an expires_at that already passed (earliest: {{ $value | humanizeTimestamp }}). Affected rules are
                    still being enforced: expiry is informational only and does not disable them. Check the tenant's
                    limited_queries configuration and remove or renew any rule that's no longer needed.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirlimitedqueryruleexpired
              expr: |
                # min() picks the earliest expiry among the tenant's limited_queries rules, so this fires as soon as
                # any one of them has expired, and keeps firing (with a moving threshold) until they're all addressed.
                min by (cluster, namespace, user) (cortex_limited_query_rule_expires_at) < time()
              for: 15m
              labels:
                severity: warning
            - alert: MimirSchedulerQueriesStuck
              annotations:
                message: |
                    There are {{ $value }} queued up queries in {{ $labels.cluster }}/{{ $labels.namespace }} {{ $labels.job }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirschedulerqueriesstuck
              expr: |
                # There are some queries in the queue.
                (sum by (cluster, namespace, job) (cortex_query_scheduler_queue_length) > 0)
    
                # And the queue size doesn't decrease.
                # We use a hardcoded 5s subquery step rather than a dynamic step interval. Prometheus aligns subquery
                # evaluation times to the Unix epoch modulo the step, so a larger step can miss brief decreases in
                # queue length that fall between evaluation points, causing delta() to appear non-negative even when
                # the queue is slowly draining. With 5s we get dense sampling to detect any short-term downward trend.
                and (
                  min_over_time(
                    delta(
                      sum by (cluster, namespace, job) (cortex_query_scheduler_queue_length)
                      [4m:5s]
                    )
                    [4m:5s]
                  ) >= 0
                )
              for: 7m
              labels:
                severity: critical
            - alert: MimirCacheRequestErrors
              annotations:
                message: |
                    The cache {{ $labels.name }} used by Mimir {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% errors for {{ $labels.operation }} operation.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircacherequesterrors
              expr: |
                (
                  sum by(cluster, namespace, name, operation) (
                    rate(thanos_cache_operation_failures_total{operation!~"add|delete"}[4m])
                  )
                  /
                  sum by(cluster, namespace, name, operation) (
                    rate(thanos_cache_operations_total{operation!~"add|delete"}[4m])
                  ) > 10
                ) * 100 > 5
              for: 5m
              labels:
                severity: warning
            - alert: MimirIngesterRestarts
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has restarted {{ printf "%.2f" $value }} times in the last 30 mins.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterrestarts
              expr: |
                (
                  sum by(cluster, namespace, pod) (
                    increase(kube_pod_container_status_restarts_total{container=~"(ingester)"}[30m])
                  )
                  >= 2
                )
                and
                (
                  count by(cluster, namespace, pod) (cortex_build_info) > 0
                )
              labels:
                severity: warning
            - alert: MimirKVStoreFailure
              annotations:
                message: |
                    Mimir {{ $labels.pod }} in  {{ $labels.cluster }}/{{ $labels.namespace }} is failing to talk to the KV store {{ $labels.kv_name }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirkvstorefailure
              expr: |
                (
                  sum by (cluster, namespace, pod, status_code, kv_name) (rate(cortex_kv_request_duration_seconds_count{status_code!~"2.+"}[4m]))
                  /
                  sum by (cluster, namespace, pod, status_code, kv_name) (rate(cortex_kv_request_duration_seconds_count{}[4m]))
                )
                # We want to get alerted only in case there's a constant failure.
                == 1
              for: 5m
              labels:
                histogram: classic
                severity: critical
            - alert: MimirKVStoreFailure
              annotations:
                message: |
                    Mimir {{ $labels.pod }} in  {{ $labels.cluster }}/{{ $labels.namespace }} is failing to talk to the KV store {{ $labels.kv_name }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirkvstorefailure
              expr: |
                (
                  sum by (cluster, namespace, pod, status_code, kv_name) (histogram_count(rate(cortex_kv_request_duration_seconds{status_code!~"2.+"}[4m])))
                  /
                  sum by (cluster, namespace, pod, status_code, kv_name) (histogram_count(rate(cortex_kv_request_duration_seconds{}[4m])))
                )
                # We want to get alerted only in case there's a constant failure.
                == 1
              for: 5m
              labels:
                histogram: native
                severity: critical
            - alert: MimirMemoryMapAreasTooHigh
              annotations:
                message: '{{ $labels.job }}/{{ $labels.pod }} has a number of mmap-ed areas close to the limit.'
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirmemorymapareastoohigh
              expr: |
                process_memory_map_areas{job=~".*/(ingester.*|cortex|mimir|store-gateway.*|cortex|mimir)"} / process_memory_map_areas_limit{job=~".*/(ingester.*|cortex|mimir|store-gateway.*|cortex|mimir)"} > 0.8
              for: 5m
              labels:
                severity: critical
            - alert: MimirIngesterInstanceHasNoTenants
              annotations:
                message: Mimir ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has no tenants assigned.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterinstancehasnotenants
              expr: |
                (
                  (min by(cluster, namespace, pod) (cortex_ingester_memory_users) == 0)
                  unless
                  (max by(cluster, namespace, pod) (cortex_lifecycler_read_only) > 0)
                )
                and on (cluster, namespace)
                # Only if there are more timeseries than would be expected due to continuous testing load
                (
                  ( # Classic storage timeseries
                    sum by(cluster, namespace) (cortex_ingester_memory_series)
                    /
                    max by(cluster, namespace) (cortex_distributor_replication_factor)
                  )
                  or
                  ( # Ingest storage timeseries
                    sum by(cluster, namespace) (
                      max by(ingester_id, read_compartment, cluster, namespace) (
                        label_replace(label_replace(cortex_ingester_memory_series, "read_compartment", "$1", "job", ".*-rc-([0-9]+)"),
                          "ingester_id", "$1",
                          "pod", ".*-([0-9]+)$"
                        )
                      )
                    )
                  )
                ) > 100000
              for: 1h
              labels:
                severity: warning
            - alert: MimirRulerInstanceHasNoRuleGroups
              annotations:
                message: Mimir ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has no rule groups assigned.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulerinstancehasnorulegroups
              expr: |
                # Alert on ruler instances in microservices mode that have no rule groups assigned,
                min by(cluster, namespace, pod) (cortex_ruler_managers_total{pod=~"(.*mimir-)?ruler.*"}) == 0
                # but only if other ruler instances of the same cell do have rule groups assigned
                and on (cluster, namespace)
                (max by(cluster, namespace) (cortex_ruler_managers_total) > 0)
                # and there are more than two instances in any zone (or overall)
                and on (cluster, namespace)
                (max by (cluster, namespace) (count by (cluster, namespace, job) (cortex_ruler_managers_total) > 2))
              for: 1h
              labels:
                severity: warning
            - alert: MimirIngestedDataTooFarInTheFuture
              annotations:
                message: Mimir ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has ingested samples with timestamps more than 1h in the future.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesteddatatoofarinthefuture
              expr: |
                max by(cluster, namespace, pod) (
                    cortex_ingester_tsdb_head_max_timestamp_seconds - time()
                    and
                    cortex_ingester_tsdb_head_max_timestamp_seconds > 0
                ) > 60*60
              for: 5m
              labels:
                severity: warning
            - alert: MimirStoreGatewayTooManyFailedOperations
              annotations:
                message: Mimir store-gateway in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ $value | humanizePercentage }} errors while doing {{ $labels.operation }} on the object storage.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstoregatewaytoomanyfailedoperations
              expr: |
                (
                    sum by(cluster, namespace, operation) (rate(thanos_objstore_bucket_operation_failures_total{component="store-gateway"}[4m]))
                    /
                    sum by(cluster, namespace, operation) (rate(thanos_objstore_bucket_operations_total{component="store-gateway"}[4m]))
                ) >= 0.01
              for: 5m
              labels:
                severity: warning
            - alert: MimirServerInvalidClusterLabelRequests
              annotations:
                message: Mimir servers in {{ $labels.cluster }}/{{ $labels.namespace }} are receiving requests with invalid cluster validation labels.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirserverinvalidclusterlabelrequests
              expr: |
                (sum by (cluster, namespace, protocol) (rate(cortex_server_invalid_cluster_validation_label_requests_total{}[5m]))) > 0
                # Alert only for namespaces with Mimir clusters.
                and on (cluster, namespace) (mimir_build_info > 0)
              labels:
                severity: warning
            - alert: MimirClientInvalidClusterLabelRequests
              annotations:
                message: Mimir clients in {{ $labels.cluster }}/{{ $labels.namespace }} are having requests rejected due to invalid cluster validation labels.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirclientinvalidclusterlabelrequests
              expr: |
                (sum by (cluster, namespace, protocol) (rate(cortex_client_invalid_cluster_validation_label_requests_total{}[5m]))) > 0
                # Alert only for namespaces with Mimir clusters.
                and on (cluster, namespace) (mimir_build_info > 0)
              labels:
                severity: warning
            - alert: MimirRingMembersMismatch
              annotations:
                message: |
                    Number of members in Mimir ingester hash ring does not match the expected number in {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirringmembersmismatch
              expr: |
                (
                  (
                    avg by(cluster, namespace) (sum by(cluster, namespace, pod) (cortex_ring_members{name="ingester",job=~".*/(ingester.*|cortex|mimir)",job!~".*/(ingester.*-partition)"}))
                    != sum by(cluster, namespace) (up{job=~".*/(ingester.*|cortex|mimir)",job!~".*/(ingester.*-partition)"})
                  )
                  unless on(cluster, namespace)
                  (
                    sum by(cluster, namespace) (kube_statefulset_replicas{statefulset=~".*ingester.*"})
                      !=
                    sum by(cluster, namespace) (kube_statefulset_status_replicas_updated{statefulset=~".*ingester.*"})
                  )
                )
                and
                (
                  count by(cluster, namespace) (cortex_build_info) > 0
                )
              for: 15m
              labels:
                component: ingester
                severity: warning
            - alert: MimirHighGRPCStreamsPerConnection
              annotations:
                message: |
                    Container {{ $labels.container }} in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing high GRPC concurrent streams per connection.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirhighgrpcstreamsperconnection
              expr: |
                max(avg_over_time(grpc_concurrent_streams_by_conn_max[10m])) by (cluster, namespace, container)
                /
                min(cortex_grpc_concurrent_streams_limit) by (cluster, namespace, container) > 0.9
              labels:
                severity: warning
            - alert: MimirMixedQuerierQueryPlanVersionSupport
              annotations:
                message: |
                    Queriers in the same %(product)s cluster and query path are reporting different maximum supported query plan versions.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirmixedquerierqueryplanversionsupport
              expr: |
                min by (cluster, namespace, container) (cortex_querier_maximum_supported_query_plan_version)
                !=
                max by (cluster, namespace, container) (cortex_querier_maximum_supported_query_plan_version)
              for: 15m
              labels:
                severity: warning
            - alert: MimirMixedQueryFrontendQueryPlanVersionSupport
              annotations:
                message: |
                    Query-frontends in the same Mimir cluster and query path have calculated different maximum supported query plan versions.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirmixedqueryfrontendqueryplanversionsupport
              expr: |
                min by (cluster, namespace, container) (cortex_query_frontend_querier_ring_calculated_maximum_supported_query_plan_version)
                !=
                max by (cluster, namespace, container) (cortex_query_frontend_querier_ring_calculated_maximum_supported_query_plan_version)
              for: 15m
              labels:
                severity: warning
            - alert: MimirQueryFrontendsAndQueriersDisagreeOnSupportedQueryPlanVersion
              annotations:
                message: |
                    Query-frontends and queriers are reporting different maximum supported query plan versions.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirqueryfrontendsandqueriersdisagreeonsupportedqueryplanversion
              expr: |
                # The label_replace calls below are so that we can match queriers with container labels like "ruler-querier" to
                # query-frontends with container labels like "ruler-query-frontend".
                # We support having the querier/query-frontend part as both a prefix and a suffix to support situations where the
                # query path name appears at the beginning (eg. "ruler-querier") or at the end (eg. "querier-mqe-test").
    
                min by (cluster, namespace, query_path) (
                  label_replace(
                    cortex_querier_maximum_supported_query_plan_version,
                    "query_path", "$2", "container", "(querier)?-?(.*)-?(querier)?"
                  )
                )
                !=
                min by (cluster, namespace, query_path) (
                  label_replace(
                    # Exclude the case where query-frontends failed to compute a maximum supported query plan version altogether (reporting -1), as
                    # that is covered by the QueryFrontendNotComputingSupportedQueryPlanVersion alert.
                    cortex_query_frontend_querier_ring_calculated_maximum_supported_query_plan_version != -1,
                    "query_path", "$2", "container", "(query-frontend)?-?(.*)-?(query-frontend)?"
                  )
                )
              for: 15m
              labels:
                severity: warning
            - alert: MimirQueryFrontendNotComputingSupportedQueryPlanVersion
              annotations:
                message: |
                    Query-frontends are failing to compute a maximum supported query plan version.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirqueryfrontendnotcomputingsupportedqueryplanversion
              expr: |
                count by (cluster, namespace, container) (cortex_query_frontend_querier_ring_calculated_maximum_supported_query_plan_version == -1) > 0
              for: 5m
              labels:
                severity: warning
        - name: mimir_instance_limits_alerts
          rules:
            - alert: MimirIngesterReachingSeriesLimit
              annotations:
                message: |
                    Ingester {{ $labels.job }}/{{ $labels.pod }} has reached {{ $value | humanizePercentage }} of its series limit.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterreachingserieslimit
              expr: |
                (
                    (cortex_ingester_memory_series / ignoring(limit) cortex_ingester_instance_limits{limit="max_series"})
                    and ignoring (limit)
                    (cortex_ingester_instance_limits{limit="max_series"} > 0)
                ) > 0.8
              for: 3h
              labels:
                severity: warning
            - alert: MimirIngesterReachingSeriesLimit
              annotations:
                message: |
                    Ingester {{ $labels.job }}/{{ $labels.pod }} has reached {{ $value | humanizePercentage }} of its series limit.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterreachingserieslimit
              expr: |
                (
                    (cortex_ingester_memory_series / ignoring(limit) cortex_ingester_instance_limits{limit="max_series"})
                    and ignoring (limit)
                    (cortex_ingester_instance_limits{limit="max_series"} > 0)
                ) > 0.9
              for: 5m
              labels:
                severity: critical
            - alert: MimirIngesterReachingTenantsLimit
              annotations:
                message: |
                    Ingester {{ $labels.job }}/{{ $labels.pod }} has reached {{ $value | humanizePercentage }} of its tenant limit.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterreachingtenantslimit
              expr: |
                (
                    (cortex_ingester_memory_users / ignoring(limit) cortex_ingester_instance_limits{limit="max_tenants"})
                    and ignoring (limit)
                    (cortex_ingester_instance_limits{limit="max_tenants"} > 0)
                ) > 0.7
              for: 5m
              labels:
                severity: warning
            - alert: MimirIngesterReachingTenantsLimit
              annotations:
                message: |
                    Ingester {{ $labels.job }}/{{ $labels.pod }} has reached {{ $value | humanizePercentage }} of its tenant limit.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterreachingtenantslimit
              expr: |
                (
                    (cortex_ingester_memory_users / ignoring(limit) cortex_ingester_instance_limits{limit="max_tenants"})
                    and ignoring (limit)
                    (cortex_ingester_instance_limits{limit="max_tenants"} > 0)
                ) > 0.8
              for: 5m
              labels:
                severity: critical
            - alert: MimirReachingTCPConnectionsLimit
              annotations:
                message: |
                    Mimir instance {{ $labels.job }}/{{ $labels.pod }} has reached {{ $value | humanizePercentage }} of its TCP connections limit for {{ $labels.protocol }} protocol.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirreachingtcpconnectionslimit
              expr: |
                cortex_tcp_connections / cortex_tcp_connections_limit > 0.8 and
                cortex_tcp_connections_limit > 0
              for: 5m
              labels:
                severity: critical
            - alert: MimirDistributorInflightRequestsHigh
              annotations:
                message: |
                    Distributor {{ $labels.job }}/{{ $labels.pod }} has reached {{ $value | humanizePercentage }} of its inflight push request limit.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirdistributorinflightrequestshigh
              expr: |
                (
                    (cortex_distributor_inflight_push_requests / ignoring(limit) cortex_distributor_instance_limits{limit="max_inflight_push_requests"})
                    and ignoring (limit)
                    (cortex_distributor_instance_limits{limit="max_inflight_push_requests"} > 0)
                ) > 0.8
              for: 5m
              labels:
                severity: critical
        - name: mimir-rollout-alerts
          rules:
            - alert: MimirRolloutStuck
              annotations:
                message: |
                    The {{ $labels.rollout_group }} rollout is stuck in {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrolloutstuck
              expr: |
                (
                  # Query for rollout groups in certain namespaces that are being updated, dropping the revision label.
                  max by (cluster, namespace, rollout_group) (
                    sum by (cluster, namespace, rollout_group, revision) (label_replace(kube_statefulset_status_current_revision, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                      unless
                    sum by (cluster, namespace, rollout_group, revision) (label_replace(kube_statefulset_status_update_revision, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                  )
                    # Multiply by replicas in corresponding rollout groups not fully updated to the current revision.
                    *
                  (
                    sum by (cluster, namespace, rollout_group) (label_replace(kube_statefulset_replicas, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                      !=
                    sum by (cluster, namespace, rollout_group) (label_replace(kube_statefulset_status_replicas_updated, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                  )
                ) and (
                  # Pick only those which are unchanging for the interval.
                  changes(sum by (cluster, namespace, rollout_group) (label_replace(kube_statefulset_status_replicas_updated, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))[15m:1m])
                    ==
                  0
                )
                # Include only Mimir namespaces.
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
              for: 30m
              labels:
                severity: warning
                workload_type: statefulset
            - alert: MimirRolloutStuck
              annotations:
                message: |
                    The {{ $labels.rollout_group }} rollout is stuck in {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrolloutstuck
              expr: |
                (
                  # Query for rollout groups in certain namespaces that are being updated, dropping the revision label.
                  max by (cluster, namespace, rollout_group) (
                    sum by (cluster, namespace, rollout_group, revision) (label_replace(kube_statefulset_status_current_revision, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                      unless
                    sum by (cluster, namespace, rollout_group, revision) (label_replace(kube_statefulset_status_update_revision, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                  )
                    # Multiply by replicas in corresponding rollout groups not fully updated to the current revision.
                    *
                  (
                    sum by (cluster, namespace, rollout_group) (label_replace(kube_statefulset_replicas, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                      !=
                    sum by (cluster, namespace, rollout_group) (label_replace(kube_statefulset_status_replicas_updated, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))
                  )
                ) and (
                  # Pick only those which are unchanging for the interval.
                  changes(sum by (cluster, namespace, rollout_group) (label_replace(kube_statefulset_status_replicas_updated, "rollout_group", "$1", "statefulset", "(.*?)(?:-zone-[a-z])?"))[15m:1m])
                    ==
                  0
                )
                # Include only Mimir namespaces.
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
              for: 6h
              labels:
                severity: critical
                workload_type: statefulset
            - alert: MimirRolloutStuck
              annotations:
                message: |
                    The {{ $labels.rollout_group }} rollout is stuck in {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrolloutstuck
              expr: |
                (
                  sum without(deployment) (label_replace(kube_deployment_spec_replicas, "rollout_group", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"))
                    !=
                  sum without(deployment) (label_replace(kube_deployment_status_replicas_updated, "rollout_group", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"))
                ) and (
                  changes(sum without(deployment) (label_replace(kube_deployment_status_replicas_updated, "rollout_group", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"))[15m:1m])
                    ==
                  0
                )
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
              for: 30m
              labels:
                severity: warning
                workload_type: deployment
            - alert: MimirRolloutStuck
              annotations:
                message: |
                    The {{ $labels.rollout_group }} rollout is stuck in {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrolloutstuck
              expr: |
                (
                  sum without(deployment) (label_replace(kube_deployment_spec_replicas, "rollout_group", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"))
                    !=
                  sum without(deployment) (label_replace(kube_deployment_status_replicas_updated, "rollout_group", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"))
                ) and (
                  changes(sum without(deployment) (label_replace(kube_deployment_status_replicas_updated, "rollout_group", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"))[15m:1m])
                    ==
                  0
                )
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
              for: 6h
              labels:
                severity: critical
                workload_type: deployment
            - alert: RolloutOperatorNotReconciling
              annotations:
                message: |
                    Rollout operator is not reconciling the rollout group {{ $labels.rollout_group }} in {{ $labels.cluster }}/{{ $labels.namespace }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#rolloutoperatornotreconciling
              expr: |
                max by(cluster, namespace, rollout_group) (time() - rollout_operator_last_successful_group_reconcile_timestamp_seconds) > 600
              for: 5m
              labels:
                severity: critical
        - name: mimir-provisioning
          rules:
            - alert: MimirAllocatingTooMuchMemory
              annotations:
                message: |
                    Instance {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is using too much memory.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirallocatingtoomuchmemory
              expr: |
                (
                  # We use RSS instead of working set memory because of the ingester's extensive usage of mmap.
                  # See: https://github.com/grafana/mimir/issues/2466
                  container_memory_rss{container=~"(ingester)"}
                    /
                  ( container_spec_memory_limit_bytes{container=~"(ingester)"} > 0 )
                )
                # Match only Mimir namespaces.
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
                > 0.65
              for: 15m
              labels:
                severity: warning
            - alert: MimirAllocatingTooMuchMemory
              annotations:
                message: |
                    Instance {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is using too much memory.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirallocatingtoomuchmemory
              expr: |
                (
                  # We use RSS instead of working set memory because of the ingester's extensive usage of mmap.
                  # See: https://github.com/grafana/mimir/issues/2466
                  container_memory_rss{container=~"(ingester)"}
                    /
                  ( container_spec_memory_limit_bytes{container=~"(ingester)"} > 0 )
                )
                # Match only Mimir namespaces.
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
                > 0.8
              for: 15m
              labels:
                severity: critical
        - name: ruler_alerts
          rules:
            - alert: MimirRulerTooManyFailedPushes
              annotations:
                message: |
                    Mimir Ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% write (push) errors.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulertoomanyfailedpushes
              expr: |
                100 * (
                # Here it matches on empty "reason" for backwards compatibility, with when the metric didn't have this label.
                sum by (cluster, namespace, pod) (rate(cortex_ruler_write_requests_failed_total{reason=~"(error|^$)"}[4m]))
                  /
                sum by (cluster, namespace, pod) (rate(cortex_ruler_write_requests_total[4m]))
                ) > 1
              for: 5m
              labels:
                severity: critical
            - alert: MimirRulerTooManyFailedQueries
              annotations:
                message: |
                    Mimir Ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% errors while evaluating rules.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulertoomanyfailedqueries
              expr: |
                100 * (
                # Here it matches on empty "reason" for backwards compatibility, with when the metric didn't have this label.
                sum by (cluster, namespace, pod) (rate(cortex_ruler_queries_failed_total{reason=~"(error|^$)"}[4m]))
                  /
                sum by (cluster, namespace, pod) (rate(cortex_ruler_queries_total[4m]))
                ) > 1
              for: 5m
              labels:
                severity: critical
            - alert: MimirRulersMissedEvaluations
              annotations:
                message: |
                    Mimir Rulers in {{ $labels.cluster }}/{{ $labels.namespace }} are experiencing {{ printf "%.2f" $value }}% missed iterations.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulersmissedevaluations
              expr: |
                100 * (
                sum by (cluster, namespace) (rate(cortex_prometheus_rule_group_iterations_missed_total[4m]))
                  /
                sum by (cluster, namespace) (rate(cortex_prometheus_rule_group_iterations_total[4m]))
                ) > 1
              for: 5m
              labels:
                severity: warning
            - alert: MimirRulerMissedEvaluations
              annotations:
                message: |
                    Mimir Ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% missed iterations.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulermissedevaluations
              expr: |
                100 * (
                sum by (cluster, namespace, pod) (rate(cortex_prometheus_rule_group_iterations_missed_total[4m]))
                  /
                sum by (cluster, namespace, pod) (rate(cortex_prometheus_rule_group_iterations_total[4m]))
                ) > 5
              for: 5m
              labels:
                severity: warning
            - alert: MimirRulerFailedRingCheck
              annotations:
                message: |
                    Mimir Rulers in {{ $labels.cluster }}/{{ $labels.namespace }} are experiencing errors when checking the ring for rule group ownership.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulerfailedringcheck
              expr: |
                sum by (cluster, namespace, job) (rate(cortex_ruler_ring_check_errors_total[4m]))
                   > 0
              for: 5m
              labels:
                severity: critical
            - alert: MimirRulerRemoteEvaluationFailing
              annotations:
                message: |
                    Mimir rulers in {{ $labels.cluster }}/{{ $labels.namespace }} are failing to perform {{ printf "%.2f" $value }}% of remote evaluations through the ruler-query-frontend.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulerremoteevaluationfailing
              expr: |
                (
                  sum by (cluster, namespace) (rate(cortex_request_duration_seconds_count{status_code=~"5..", route="/httpgrpc.HTTP/Handle", job=~".*/(ruler-query-frontend.*)"}[5m]))
                  /
                  sum by (cluster, namespace) (rate(cortex_request_duration_seconds_count{route="/httpgrpc.HTTP/Handle", job=~".*/(ruler-query-frontend.*)"}[5m]))
                ) * 100 > 1
              for: 5m
              labels:
                histogram: classic
                severity: warning
            - alert: MimirRulerRemoteEvaluationFailing
              annotations:
                message: |
                    Mimir rulers in {{ $labels.cluster }}/{{ $labels.namespace }} are failing to perform {{ printf "%.2f" $value }}% of remote evaluations through the ruler-query-frontend.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrulerremoteevaluationfailing
              expr: |
                (
                  sum by (cluster, namespace) (histogram_count(rate(cortex_request_duration_seconds{status_code=~"5..", route="/httpgrpc.HTTP/Handle", job=~".*/(ruler-query-frontend.*)"}[5m])))
                  /
                  sum by (cluster, namespace) (histogram_count(rate(cortex_request_duration_seconds{route="/httpgrpc.HTTP/Handle", job=~".*/(ruler-query-frontend.*)"}[5m])))
                ) * 100 > 1
              for: 5m
              labels:
                histogram: native
                severity: warning
        - name: gossip_alerts
          rules:
            - alert: MimirGossipMembersTooHigh
              annotations:
                message: One or more Mimir instances in {{ $labels.cluster }}/{{ $labels.namespace }} consistently sees a higher than expected number of gossip members.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirgossipmemberstoohigh
              expr: |
                max by (cluster, namespace) (memberlist_client_cluster_members_count)
                >
                (sum by (cluster, namespace) (up{job=~".*/(admin-api|alertmanager|compactor.*|distributor.*|ingester.*|query-frontend.*|querier.*|ruler|ruler-zone-.*|ruler-querier.*|store-gateway.*|cortex|mimir)"}) + 10)
              for: 20m
              labels:
                severity: warning
            - alert: MimirGossipMembersTooLow
              annotations:
                message: One or more Mimir instances in {{ $labels.cluster }}/{{ $labels.namespace }} consistently sees a lower than expected number of gossip members.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirgossipmemberstoolow
              expr: |
                min by (cluster, namespace) (memberlist_client_cluster_members_count)
                <
                (sum by (cluster, namespace) (up{job=~".*/(admin-api|alertmanager|compactor.*|distributor.*|ingester.*|query-frontend.*|querier.*|ruler|ruler-zone-.*|ruler-querier.*|store-gateway.*|cortex|mimir)"}) * 0.5)
              for: 20m
              labels:
                severity: warning
            - alert: MimirGossipMembersEndpointsOutOfSync
              annotations:
                message: Mimir gossip-ring service endpoints list in {{ $labels.cluster }}/{{ $labels.namespace }} is out of sync.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirgossipmembersendpointsoutofsync
              expr: |
                (
                  count by(cluster, namespace) (
                    kube_endpoint_address{endpoint="gossip-ring"}
                    unless on (cluster, namespace, ip)
                    label_replace(kube_pod_info, "ip", "$1", "pod_ip", "(.*)"))
                  /
                  count by(cluster, namespace) (
                    kube_endpoint_address{endpoint="gossip-ring"}
                  )
                  * 100 > 10
                )
    
                # Filter by Mimir only.
                and (count by(cluster, namespace) (cortex_build_info) > 0)
              for: 15m
              labels:
                severity: warning
            - alert: MimirGossipMembersEndpointsOutOfSync
              annotations:
                message: Mimir gossip-ring service endpoints list in {{ $labels.cluster }}/{{ $labels.namespace }} is out of sync.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirgossipmembersendpointsoutofsync
              expr: |
                (
                  count by(cluster, namespace) (
                    kube_endpoint_address{endpoint="gossip-ring"}
                    unless on (cluster, namespace, ip)
                    label_replace(kube_pod_info, "ip", "$1", "pod_ip", "(.*)"))
                  /
                  count by(cluster, namespace) (
                    kube_endpoint_address{endpoint="gossip-ring"}
                  )
                  * 100 > 50
                )
    
                # Filter by Mimir only.
                and (count by(cluster, namespace) (cortex_build_info) > 0)
              for: 5m
              labels:
                severity: critical
            - alert: MimirMemberlistBridgeZoneUnavailable
              annotations:
                message: Mimir memberlist-bridge in {{ $labels.cluster }}/{{ $labels.namespace }} {{ $labels.zone }} has no available pods.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirmemberlistbridgezoneunavailable
              expr: |
                # Find the expected memberlist-bridge zonal deployments.
                count by (cluster, namespace, zone) (
                    label_replace(
                        kube_deployment_spec_replicas{deployment=~"memberlist-bridge-zone-[abc]"} > 0,
                        "zone", "$1", "deployment", "memberlist-bridge-(zone-[abc])"
                    )
                )
                # Excluding zones where there is at least 1 healthy memberlist-bridge.
                unless (
                    count by(cluster, namespace, zone) (
                        label_replace(
                            kube_pod_status_ready{pod=~"memberlist-bridge-zone-[abc]-.*", condition="true"} == 1,
                            "zone", "$1", "pod", "memberlist-bridge-(zone-[abc]).*"
                        )
                    ) > 0
                )
              for: 10m
              labels:
                severity: critical
            - alert: MimirMemberlistZoneAwareRoutingAutoFailover
              annotations:
                message: Mimir memberlist in {{ $labels.cluster }}/{{ $labels.namespace }} has automatically temporarily disabled zone-aware routing because it detected missing memberlist bridges.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirmemberlistzoneawareroutingautofailover
              expr: |
                sum by (cluster, namespace) (rate(memberlist_client_zone_aware_routing_select_nodes_skipped_total[4m])) > 0
              for: 10m
              labels:
                severity: warning
        - name: golang_alerts
          rules:
            - alert: MimirGoThreadsTooHigh
              annotations:
                message: |
                    Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is running a very high number of Go threads.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirgothreadstoohigh
              expr: |
                # We filter by the namespace because go_threads can be very high cardinality in a large organization.
                max by(cluster, namespace, pod) (go_threads{job=~".*(cortex|mimir).*"} > 5000)
    
                # Further filter on namespaces actually running Mimir.
                and on (cluster, namespace) (count by (cluster, namespace) (cortex_build_info))
              for: 15m
              labels:
                severity: warning
            - alert: MimirGoThreadsTooHigh
              annotations:
                message: |
                    Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is running a very high number of Go threads.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirgothreadstoohigh
              expr: |
                # We filter by the namespace because go_threads can be very high cardinality in a large organization.
                max by(cluster, namespace, pod) (go_threads{job=~".*(cortex|mimir).*"} > 8000)
    
                # Further filter on namespaces actually running Mimir.
                and on (cluster, namespace) (count by (cluster, namespace) (cortex_build_info))
              for: 15m
              labels:
                severity: critical
        - name: alertmanager_alerts
          rules:
            - alert: MimirAlertmanagerSyncConfigsFailing
              annotations:
                message: |
                    Mimir Alertmanager {{ $labels.job }}/{{ $labels.pod }} is failing to read tenant configurations from storage.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagersyncconfigsfailing
              expr: |
                rate(cortex_alertmanager_sync_configs_failed_total[5m]) > 0
              for: 30m
              labels:
                severity: critical
            - alert: MimirAlertmanagerRingCheckFailing
              annotations:
                message: |
                    Mimir Alertmanager {{ $labels.job }}/{{ $labels.pod }} is unable to check tenants ownership via the ring.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerringcheckfailing
              expr: |
                rate(cortex_alertmanager_ring_check_errors_total[4m]) > 0
              for: 10m
              labels:
                severity: critical
            - alert: MimirAlertmanagerStateMergeFailing
              annotations:
                message: |
                    Mimir Alertmanager {{ $labels.job }}/{{ $labels.pod }} is failing to merge partial state changes received from a replica.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerstatemergefailing
              expr: |
                rate(cortex_alertmanager_partial_state_merges_failed_total[4m]) > 0
              for: 10m
              labels:
                severity: critical
            - alert: MimirAlertmanagerReplicationFailing
              annotations:
                message: |
                    Mimir Alertmanager {{ $labels.job }}/{{ $labels.pod }} is failing to replicating partial state to its replicas.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerreplicationfailing
              expr: |
                rate(cortex_alertmanager_state_replication_failed_total[4m]) > 0
              for: 10m
              labels:
                severity: critical
            - alert: MimirAlertmanagerPersistStateFailing
              annotations:
                message: |
                    Mimir Alertmanager {{ $labels.job }}/{{ $labels.pod }} is unable to persist full state snaphots to remote storage.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerpersiststatefailing
              expr: |
                rate(cortex_alertmanager_state_persist_failed_total[15m]) > 0
              for: 1h
              labels:
                severity: critical
            - alert: MimirAlertmanagerInitialSyncFailed
              annotations:
                message: |
                    Mimir Alertmanager {{ $labels.job }}/{{ $labels.pod }} was unable to obtain some initial state when starting up.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerinitialsyncfailed
              expr: |
                increase(cortex_alertmanager_state_initial_sync_completed_total{outcome="failed"}[4m]) > 0
              labels:
                severity: warning
            - alert: MimirAlertmanagerAllocatingTooMuchMemory
              annotations:
                message: |
                    Alertmanager {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is using too much memory.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerallocatingtoomuchmemory
              expr: |
                (container_memory_working_set_bytes{container="alertmanager"} / container_spec_memory_limit_bytes{container="alertmanager"}) > 0.80
                and
                (container_spec_memory_limit_bytes{container="alertmanager"} > 0)
              for: 15m
              labels:
                severity: warning
            - alert: MimirAlertmanagerAllocatingTooMuchMemory
              annotations:
                message: |
                    Alertmanager {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is using too much memory.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerallocatingtoomuchmemory
              expr: |
                (container_memory_working_set_bytes{container="alertmanager"} / container_spec_memory_limit_bytes{container="alertmanager"}) > 0.90
                and
                (container_spec_memory_limit_bytes{container="alertmanager"} > 0)
              for: 15m
              labels:
                severity: critical
            - alert: MimirAlertmanagerInstanceHasNoTenants
              annotations:
                message: Mimir alertmanager {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} owns no tenants.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiralertmanagerinstancehasnotenants
              expr: |
                # Alert on alertmanager instances in microservices mode that own no tenants,
                min by(cluster, namespace, pod) (cortex_alertmanager_tenants_owned{pod=~"(.*mimir-)?alertmanager.*"}) == 0
                # but only if other instances of the same cell do have tenants assigned.
                and on (cluster, namespace)
                max by(cluster, namespace) (cortex_alertmanager_tenants_owned) > 0
              for: 1h
              labels:
                severity: warning
        - name: mimir_blocks_alerts
          rules:
            - alert: MimirIngesterNotShippingBlocks
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not shipped any block in the last 4 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesternotshippingblocks
              expr: |
                (min by(cluster, namespace, pod) (time() - cortex_ingester_shipper_last_successful_upload_timestamp_seconds) > 60 * 60 * 4)
                and
                (max by(cluster, namespace, pod) (cortex_ingester_shipper_last_successful_upload_timestamp_seconds) > 0)
                and
                # Only if the ingester has ingested samples over the last 4h.
                (max by(cluster, namespace, pod) (max_over_time(cluster_namespace_pod:cortex_ingester_ingested_samples_total:rate4m[4h])) > 0)
                and
                # Only if the ingester was ingesting samples 4h ago. This protects against the case where the ingester replica
                # had ingested samples in the past, then no traffic was received for a long period and then it starts
                # receiving samples again. Without this check, the alert would fire as soon as it gets back receiving
                # samples, while the a block shipping is expected within the next 4h.
                (max by(cluster, namespace, pod) (max_over_time(cluster_namespace_pod:cortex_ingester_ingested_samples_total:rate4m[1h] offset 4h)) > 0)
                # And only if blocks aren't shipped by the block-builder.
                unless on (cluster, namespace)
                (max by (cluster, namespace) (max_over_time(cortex_blockbuilder_tsdb_last_successful_compact_and_upload_timestamp_seconds[30m])) > 0)
              for: 15m
              labels:
                severity: critical
            - alert: MimirIngesterNotShippingBlocksSinceStart
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not shipped any block in the last 4 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesternotshippingblockssincestart
              expr: |
                (max by(cluster, namespace, pod) (cortex_ingester_shipper_last_successful_upload_timestamp_seconds) == 0)
                and
                (max by(cluster, namespace, pod) (max_over_time(cluster_namespace_pod:cortex_ingester_ingested_samples_total:rate4m[4h])) > 0)
                # Only if blocks aren't shipped by the block-builder.
                unless on (cluster, namespace)
                (max by (cluster, namespace) (max_over_time(cortex_blockbuilder_tsdb_last_successful_compact_and_upload_timestamp_seconds[30m])) > 0)
              for: 4h
              labels:
                severity: critical
            - alert: MimirIngesterHasUnshippedBlocks
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has compacted a block {{ $value | humanizeDuration }} ago but it hasn't been successfully uploaded to the storage yet.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterhasunshippedblocks
              expr: |
                (time() - cortex_ingester_oldest_unshipped_block_timestamp_seconds > 3600)
                and
                (cortex_ingester_oldest_unshipped_block_timestamp_seconds > 0)
                # Only if blocks aren't shipped by the block-builder.
                unless on (cluster, namespace)
                (max by (cluster, namespace) (max_over_time(cortex_blockbuilder_tsdb_last_successful_compact_and_upload_timestamp_seconds[30m])) > 0)
              for: 15m
              labels:
                severity: critical
            - alert: MimirIngesterTSDBHeadCompactionFailed
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to compact TSDB head.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbheadcompactionfailed
              expr: |
                rate(cortex_ingester_tsdb_compactions_failed_total[5m]) > 0
              for: 15m
              labels:
                severity: critical
            - alert: MimirIngesterTSDBHeadTruncationFailed
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to truncate TSDB head.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbheadtruncationfailed
              expr: |
                rate(cortex_ingester_tsdb_head_truncations_failed_total[5m]) > 0
              labels:
                severity: critical
            - alert: MimirIngesterTSDBCheckpointCreateFailed
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to create TSDB checkpoint.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbcheckpointcreatefailed
              expr: |
                rate(cortex_ingester_tsdb_checkpoint_creations_failed_total[5m]) > 0
              labels:
                severity: critical
            - alert: MimirIngesterTSDBCheckpointDeleteFailed
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to delete TSDB checkpoint.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbcheckpointdeletefailed
              expr: |
                rate(cortex_ingester_tsdb_checkpoint_deletions_failed_total[5m]) > 0
              labels:
                severity: critical
            - alert: MimirIngesterTSDBWALTruncationFailed
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to truncate TSDB WAL.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbwaltruncationfailed
              expr: |
                rate(cortex_ingester_tsdb_wal_truncations_failed_total[5m]) > 0
              labels:
                severity: warning
            - alert: MimirIngesterTSDBWALCorrupted
              annotations:
                message: Mimir Ingester in {{ $labels.cluster }}/{{ $labels.namespace }} got a corrupted TSDB WAL.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbwalcorrupted
              expr: |
                # alert when there are more than one corruptions
                count by (cluster, namespace) (rate(cortex_ingester_tsdb_wal_corruptions_total[5m]) > 0) > 1
                and
                # and there is only one zone
                count by (cluster, namespace) (group by (cluster, namespace, job) (cortex_ingester_tsdb_wal_corruptions_total)) == 1
              labels:
                deployment: single-zone
                severity: critical
            - alert: MimirIngesterTSDBWALCorrupted
              annotations:
                message: Mimir Ingester in {{ $labels.cluster }}/{{ $labels.namespace }} got a corrupted TSDB WAL.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbwalcorrupted
              expr: |
                # alert when there are more than one corruptions
                count by (cluster, namespace) (sum by (cluster, namespace, job) (rate(cortex_ingester_tsdb_wal_corruptions_total[5m]) > 0)) > 1
                and
                # and there are multiple zones
                count by (cluster, namespace) (group by (cluster, namespace, job) (cortex_ingester_tsdb_wal_corruptions_total)) > 1
              labels:
                deployment: multi-zone
                severity: critical
            - alert: MimirIngesterTSDBWALWritesFailed
              annotations:
                message: Mimir Ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to write to TSDB WAL.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestertsdbwalwritesfailed
              expr: |
                rate(cortex_ingester_tsdb_wal_writes_failed_total[4m]) > 0
              for: 12m
              labels:
                severity: critical
            - alert: MimirStoreGatewayHasNotSyncTheBucket
              annotations:
                message: Mimir store-gateway {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not successfully synched the bucket since {{ $value | humanizeDuration }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstoregatewayhasnotsyncthebucket
              expr: |
                (time() - cortex_bucket_stores_blocks_last_successful_sync_timestamp_seconds{component="store-gateway"} > 60 * 30)
                and
                cortex_bucket_stores_blocks_last_successful_sync_timestamp_seconds{component="store-gateway"} > 0
              for: 5m
              labels:
                severity: critical
            - alert: MimirStoreGatewayNoSyncedTenants
              annotations:
                message: Mimir store-gateway {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is not syncing any blocks for any tenant.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstoregatewaynosyncedtenants
              expr: |
                min by(cluster, namespace, pod) (cortex_bucket_stores_tenants_synced{component="store-gateway"}) == 0
              for: 1h
              labels:
                severity: warning
            - alert: MimirBucketIndexNotUpdated
              annotations:
                message: Mimir bucket index for tenant {{ $labels.user }} in {{ $labels.cluster }}/{{ $labels.namespace }}{{ if $labels.read_compartment }}/rc-{{ $labels.read_compartment }}{{ end }} has not been updated since {{ $value | humanizeDuration }}.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirbucketindexnotupdated
              expr: |
                min by(cluster, namespace, user, read_compartment) (time() - (label_replace(max_over_time(cortex_bucket_index_last_successful_update_timestamp_seconds[15m]), "read_compartment", "$1", "job", ".*-rc-([0-9]+)"))) > 2100
              for: 2m
              labels:
                severity: critical
            - alert: MimirHighVolumeLevel1BlocksQueried
              annotations:
                message: Mimir store-gateway in {{ $labels.cluster }}/{{ $labels.namespace }} is querying level 1 blocks, indicating the compactor may not be keeping up with compaction.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirhighvolumelevel1blocksqueried
              expr: |
                (
                sum by(cluster, namespace) (rate(cortex_bucket_store_series_blocks_queried_sum{component="store-gateway",level="1",out_of_order="false",job=~".*/(store-gateway.*|cortex|mimir)"}[10m]))
                /
                sum by(cluster, namespace) (rate(cortex_bucket_store_series_blocks_queried_sum{component="store-gateway",out_of_order="false",job=~".*/(store-gateway.*|cortex|mimir)"}[10m]))
                ) > 0.05
              for: 6h
              labels:
                severity: warning
        - name: mimir_compactor_alerts
          rules:
            - alert: MimirCompactorNotCleaningUpBlocks
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not successfully cleaned up blocks in the last 6 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactornotcleaningupblocks
              expr: |
                # The "last successful run" metric is updated even if the compactor owns no tenants,
                # so this alert correctly doesn't fire if compactor has nothing to do.
                (time() - cortex_compactor_block_cleanup_last_successful_run_timestamp_seconds > 60 * 60 * 6)
              for: 1h
              labels:
                severity: critical
            - alert: MimirCompactorNotRunningCompaction
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not run compaction in the last 6 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactornotrunningcompaction
              expr: |
                # The "last successful run" metric is updated even if the compactor owns no tenants,
                # so this alert correctly doesn't fire if compactor has nothing to do.
                (time() - max by(cluster, namespace, pod) (cortex_compactor_last_successful_run_timestamp_seconds) > 60 * 60 * 6)
                and
                (max by(cluster, namespace, pod) (cortex_compactor_last_successful_run_timestamp_seconds) > 0)
              for: 15m
              labels:
                reason: in-last-6h
                severity: warning
            - alert: MimirCompactorNotRunningCompaction
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not run compaction in the last 24 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactornotrunningcompaction
              expr: |
                # The "last successful run" metric is updated even if the compactor owns no tenants,
                # so this alert correctly doesn't fire if compactor has nothing to do.
                (time() - max by(cluster, namespace, pod) (cortex_compactor_last_successful_run_timestamp_seconds) > 60 * 60 * 24)
                and
                (max by(cluster, namespace, pod) (cortex_compactor_last_successful_run_timestamp_seconds) > 0)
              for: 15m
              labels:
                reason: in-last-24h
                severity: critical
            - alert: MimirCompactorNotRunningCompaction
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not run compaction since startup.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactornotrunningcompaction
              expr: |
                # The "last successful run" metric is updated even if the compactor owns no tenants,
                # so this alert correctly doesn't fire if compactor has nothing to do.
                max by(cluster, namespace, pod) (cortex_compactor_last_successful_run_timestamp_seconds) == 0
              for: 6h
              labels:
                reason: since-startup
                severity: warning
            - alert: MimirCompactorNotRunningCompaction
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not run compaction since startup.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactornotrunningcompaction
              expr: |
                # The "last successful run" metric is updated even if the compactor owns no tenants,
                # so this alert correctly doesn't fire if compactor has nothing to do.
                max by(cluster, namespace, pod) (cortex_compactor_last_successful_run_timestamp_seconds) == 0
              for: 12h
              labels:
                reason: since-startup
                severity: critical
            - alert: MimirCompactorNotRunningCompaction
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} failed to run 2 consecutive compactions.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactornotrunningcompaction
              expr: |
                sum by(cluster, namespace, pod) (increase(cortex_compactor_runs_failed_total{reason!="shutdown"}[2h])) >= 2
              labels:
                reason: consecutive-failures
                severity: critical
            - alert: MimirCompactorHasRunOutOfDiskSpace
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has run out of disk space.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactorhasrunoutofdiskspace
              expr: |
                increase(cortex_compactor_disk_out_of_space_errors_total{}[24h]) >= 1
              labels:
                reason: non-transient
                severity: critical
            - alert: MimirCompactorHasNotUploadedBlocks
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not uploaded any block in the last 24 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactorhasnotuploadedblocks
              expr: |
                (time() - (max by(cluster, namespace, pod) (thanos_objstore_bucket_last_successful_upload_time{component="compactor"})) > 60 * 60 * 24)
                and
                (max by(cluster, namespace, pod) (thanos_objstore_bucket_last_successful_upload_time{component="compactor"}) > 0)
                and
                # Only if some compactions have started. We don't want to fire this alert if the compactor has nothing to do.
                (sum by(cluster, namespace, pod) (rate(cortex_compactor_group_compaction_runs_started_total[24h])) > 0)
              for: 15m
              labels:
                severity: critical
                time_period: 24h
            - alert: MimirCompactorHasNotUploadedBlocks
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not uploaded any block since its start.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactorhasnotuploadedblocks
              expr: |
                (max by(cluster, namespace, pod) (thanos_objstore_bucket_last_successful_upload_time{component="compactor"}) == 0)
                and
                # Only if some compactions have started. We don't want to fire this alert if the compactor has nothing to do.
                (sum by(cluster, namespace, pod) (rate(cortex_compactor_group_compaction_runs_started_total[24h])) > 0)
              for: 24h
              labels:
                severity: critical
                time_period: since-start
            - alert: MimirCompactorSkippedBlocks
              annotations:
                message: 'Mimir Compactor in {{ $labels.cluster }}/{{ $labels.namespace }} has marked {{ $value }} blocks for no-compaction (reason: {{ $labels.reason }}).'
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactorskippedblocks
              expr: |
                sum by (cluster, namespace, reason) (
                  increase(cortex_compactor_blocks_marked_for_no_compaction_total[24h]) > 0
                )
              for: 5m
              labels:
                severity: critical
            - alert: MimirCompactorBuildingSparseIndexFailed
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to build sparse index headers
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactorbuildingsparseindexfailed
              expr: |
                (sum by(cluster, namespace, pod) (increase(cortex_compactor_build_sparse_headers_failures_total[5m])) > 0)
              for: 30m
              labels:
                severity: warning
            - alert: MimirCompactorOOMKilled
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has been OOMKilled {{ printf "%.2f" $value }} times in the last 4h.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactoroomkilled
              expr: |
                (
                  sum by(cluster, namespace, pod) (
                    increase(kube_pod_container_status_restarts_total{container=~"compactor"}[4h])
                  )
                  > 2
                )
                and on (cluster, namespace, pod)
                (
                  kube_pod_container_status_last_terminated_reason{container=~"compactor", reason="OOMKilled"} > 0
                )
              for: 15m
              labels:
                severity: warning
            - alert: MimirCompactorOOMKilled
              annotations:
                message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has been OOMKilled {{ printf "%.2f" $value }} times in the last 2h.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircompactoroomkilled
              expr: |
                (
                  sum by(cluster, namespace, pod) (
                    increase(kube_pod_container_status_restarts_total{container=~"compactor"}[2h])
                  )
                  > 5
                )
                and on (cluster, namespace, pod)
                (
                  kube_pod_container_status_last_terminated_reason{container=~"compactor", reason="OOMKilled"} > 0
                )
              for: 15m
              labels:
                severity: critical
        - name: mimir_distributor_alerts
          rules:
            - alert: MimirDistributorGcUsesTooMuchCpu
              annotations:
                message: Mimir distributors in {{ $labels.cluster }}/{{ $labels.namespace }} GC CPU utilization is too high.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirdistributorgcusestoomuchcpu
              expr: |
                (quantile by (cluster, namespace) (0.9, sum by (cluster, namespace, pod) (rate(go_cpu_classes_gc_total_cpu_seconds_total{container="distributor"}[5m]))
                  /
                  (
                    sum by (cluster, namespace, pod) (rate(go_cpu_classes_total_cpu_seconds_total{container="distributor"}[5m]))
                    -
                    sum by (cluster, namespace, pod) (rate(go_cpu_classes_idle_cpu_seconds_total{container="distributor"}[5m]))
                  )
                ) * 100) > 10
    
                # Alert only for namespaces with Mimir clusters.
                and (count by (cluster, namespace) (mimir_build_info) > 0)
              for: 10m
              labels:
                severity: warning
        - name: mimir_autoscaling
          rules:
            - alert: MimirAutoscalerNotActive
              annotations:
                message: The Horizontal Pod Autoscaler (HPA) {{ $labels.horizontalpodautoscaler }} in {{ $labels.namespace }} is not active.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirautoscalernotactive
              expr: |
                (
                    label_replace((
                      kube_horizontalpodautoscaler_status_condition{condition="ScalingActive",status="false"}
                      # Match only Mimir namespaces.
                      * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
                      # Add "metric" label.
                      + on(cluster, namespace, horizontalpodautoscaler) group_right
                        # Using `max by ()` so that series churn doesn't break the promQL join
                        max by (cluster, namespace, horizontalpodautoscaler, metric) (
                          label_replace(kube_horizontalpodautoscaler_spec_target_metric*0, "metric", "$1", "metric_name", "(.+)")
                        )
                      > 0),
                      "scaledObject", "$1", "horizontalpodautoscaler", "keda-hpa-(?:mimir-)?(.*)"
                    )
                )
                # Alert only if the scaling metric exists and is > 0. If the KEDA ScaledObject is configured to scale down 0,
                # then HPA ScalingActive may be false when expected to run 0 replicas. In this case, the scaling metric exported
                # by KEDA could not exist at all or being exposed with a value of 0.
                and on (cluster, namespace, metric, scaledObject) (
                  max by (cluster, namespace, metric, scaledObject) (
                    label_replace(keda_scaler_metrics_value, "namespace", "$0", "exported_namespace", ".+") > 0
                  )
                )
              for: 1h
              labels:
                severity: critical
            - alert: MimirAutoscalerKedaFailing
              annotations:
                message: The Keda ScaledObject {{ $labels.scaledObject }} in {{ $labels.namespace }} is experiencing errors.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirautoscalerkedafailing
              expr: |
                (
                    # Find KEDA scalers reporting errors.
                    label_replace(rate(keda_scaler_errors[5m]), "namespace", "$1", "exported_namespace", "(.*)")
                    # Match only Mimir namespaces.
                    * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
                )
                > 0
              for: 1h
              labels:
                severity: critical
        - name: mimir_ingest_storage_alerts
          rules:
            - alert: MimirIngesterOffsetCommitFailed
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to commit the last consumed offset.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesteroffsetcommitfailed
              expr: |
                sum by(cluster, namespace, pod) (rate(cortex_ingest_storage_reader_offset_commit_failures_total[5m]))
                /
                sum by(cluster, namespace, pod) (rate(cortex_ingest_storage_reader_offset_commit_requests_total[5m]))
                > 0.2
              for: 15m
              labels:
                severity: critical
            - alert: MimirIngesterKafkaReadFailed
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to read records from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterkafkareadfailed
              expr: |
                sum by(cluster, namespace, pod, node_id) (rate(cortex_ingest_storage_reader_read_errors_total[4m]))
                > 0
              for: 5m
              labels:
                severity: warning
            - alert: MimirIngesterKafkaReadFailed
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is failing to read records from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterkafkareadfailed
              expr: |
                sum by(cluster, namespace, pod, node_id) (rate(cortex_ingest_storage_reader_read_errors_total[4m]))
                > 0
              for: 30m
              labels:
                severity: critical
            - alert: MimirIngesterKafkaFetchErrorsRateTooHigh
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is receiving fetch errors when reading records from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterkafkafetcherrorsratetoohigh
              expr: |
                sum by (cluster, namespace, pod) (rate (cortex_ingest_storage_reader_fetch_errors_total[5m]))
                /
                sum by (cluster, namespace, pod) (rate (cortex_ingest_storage_reader_fetches_total[5m]))
                > 0.1
              for: 15m
              labels:
                severity: critical
            - alert: MimirStartingIngesterKafkaDelayGrowing
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} in "starting" phase is not reducing consumption lag of write requests read from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstartingingesterkafkadelaygrowing
              expr: |
                deriv((
                    sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_reader_receive_delay_seconds_sum{phase="starting"}[4m]))
                    /
                    sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_reader_receive_delay_seconds_count{phase="starting"}[4m]))
                )[5m:1m]) > 0
              for: 5m
              labels:
                histogram: classic
                severity: warning
            - alert: MimirStartingIngesterKafkaDelayGrowing
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} in "starting" phase is not reducing consumption lag of write requests read from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstartingingesterkafkadelaygrowing
              expr: |
                deriv((
                    sum by (cluster, namespace, pod) (histogram_sum(rate(cortex_ingest_storage_reader_receive_delay_seconds{phase="starting"}[4m])))
                    /
                    sum by (cluster, namespace, pod) (histogram_count(rate(cortex_ingest_storage_reader_receive_delay_seconds{phase="starting"}[4m])))
                )[5m:1m]) > 0
              for: 5m
              labels:
                histogram: native
                severity: warning
            - alert: MimirRunningIngesterReceiveDelayTooHigh
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} in "running" phase is too far behind in its consumption of write requests from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrunningingesterreceivedelaytoohigh
              expr: |
                (
                  sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_reader_receive_delay_seconds_sum{phase="running"}[4m]))
                  /
                  sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_reader_receive_delay_seconds_count{phase="running"}[4m]))
                ) > (2 * 60)
              for: 3m
              labels:
                histogram: classic
                severity: critical
                threshold: very_high_for_short_period
            - alert: MimirRunningIngesterReceiveDelayTooHigh
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} in "running" phase is too far behind in its consumption of write requests from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrunningingesterreceivedelaytoohigh
              expr: |
                (
                  sum by (cluster, namespace, pod) (histogram_sum(rate(cortex_ingest_storage_reader_receive_delay_seconds{phase="running"}[4m])))
                  /
                  sum by (cluster, namespace, pod) (histogram_count(rate(cortex_ingest_storage_reader_receive_delay_seconds{phase="running"}[4m])))
                ) > (2 * 60)
              for: 3m
              labels:
                histogram: native
                severity: critical
                threshold: very_high_for_short_period
            - alert: MimirRunningIngesterReceiveDelayTooHigh
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} in "running" phase is too far behind in its consumption of write requests from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrunningingesterreceivedelaytoohigh
              expr: |
                (
                  sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_reader_receive_delay_seconds_sum{phase="running"}[4m]))
                  /
                  sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_reader_receive_delay_seconds_count{phase="running"}[4m]))
                ) > 30
              for: 15m
              labels:
                histogram: classic
                severity: critical
                threshold: relatively_high_for_long_period
            - alert: MimirRunningIngesterReceiveDelayTooHigh
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} in "running" phase is too far behind in its consumption of write requests from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirrunningingesterreceivedelaytoohigh
              expr: |
                (
                  sum by (cluster, namespace, pod) (histogram_sum(rate(cortex_ingest_storage_reader_receive_delay_seconds{phase="running"}[4m])))
                  /
                  sum by (cluster, namespace, pod) (histogram_count(rate(cortex_ingest_storage_reader_receive_delay_seconds{phase="running"}[4m])))
                ) > 30
              for: 15m
              labels:
                histogram: native
                severity: critical
                threshold: relatively_high_for_long_period
            - alert: MimirIngesterKafkaProcessingFailed
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} fails to consume write requests read from Kafka due to internal errors.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterkafkaprocessingfailed
              expr: |
                (
                  sum by (cluster, namespace, pod) (
                      # This is the old metric name. We're keeping support for backward compatibility.
                    rate(cortex_ingest_storage_reader_records_failed_total{cause="server"}[4m])
                    or
                    rate(cortex_ingest_storage_reader_requests_failed_total{cause="server"}[4m])
                  ) > 0
                )
    
                # Tolerate failures during the forced TSDB head compaction, because samples older than the
                # new "head min time" will fail to be appended while the forced compaction is running.
                unless (max by (cluster, namespace, pod) (max_over_time(cortex_ingester_tsdb_forced_compactions_in_progress[4m])) > 0)
              for: 5m
              labels:
                severity: critical
            - alert: MimirIngesterKafkaProcessingStuck
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is stuck processing write requests from Kafka.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringesterkafkaprocessingstuck
              expr: |
                # Alert if the reader is not processing any records, but there buffered records to process in the Kafka client.
                (sum by (cluster, namespace, pod) (
                    # This is the old metric name. We're keeping support for backward compatibility.
                  rate(cortex_ingest_storage_reader_records_total[5m])
                  or
                  rate(cortex_ingest_storage_reader_requests_total[5m])
                ) == 0)
                and
                (sum by (cluster, namespace, pod) (cortex_ingest_storage_reader_buffered_fetched_records) > 0)
              for: 5m
              labels:
                severity: critical
            - alert: MimirIngesterMissedRecordsFromKafka
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} missed processing records from Kafka. There may be data loss.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimiringestermissedrecordsfromkafka
              expr: |
                # Alert if the ingester missed some records from Kafka.
                increase(cortex_ingest_storage_reader_missed_records_total[10m]) > 0
              labels:
                severity: critical
            - alert: MimirStrongConsistencyEnforcementFailed
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} fails to enforce strong-consistency on read-path.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstrongconsistencyenforcementfailed
              expr: |
                sum by (cluster, namespace, pod) (rate(cortex_ingest_storage_strong_consistency_failures_total[4m])) > 0
              for: 5m
              labels:
                severity: warning
            - alert: MimirStrongConsistencyOffsetMissing
              annotations:
                message: Mimir ingesters in {{ $labels.cluster }}/{{ $labels.namespace }} are receiving an unexpected high number of strongly consistent requests without an offset specified.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirstrongconsistencyoffsetmissing
              expr: |
                sum by (cluster, namespace) (rate(cortex_ingest_storage_strong_consistency_requests_total{component="partition-reader", with_offset="false"}[4m]))
                /
                sum by (cluster, namespace) (rate(cortex_ingest_storage_strong_consistency_requests_total{component="partition-reader"}[4m]))
                * 100 > 5
              for: 5m
              labels:
                severity: warning
            - alert: MimirKafkaClientProduceBufferHigh
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} Kafka client produce buffer utilization is {{ printf "%.2f" $value }}%.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirkafkaclientproducebufferhigh
              expr: |
                max by(cluster, namespace, pod) (
                    # New metric.
                    max_over_time(cortex_ingest_storage_writer_buffered_produce_bytes_distribution{quantile="1.0"}[4m])
                    or
                    # Old metric.
                    max_over_time(cortex_ingest_storage_writer_buffered_produce_bytes{quantile="1.0"}[4m])
                )
                /
                min by(cluster, namespace, pod) (min_over_time(cortex_ingest_storage_writer_buffered_produce_bytes_limit[4m]))
                * 100 > 50
              for: 5m
              labels:
                severity: critical
            - alert: MimirBlockBuilderSchedulerPendingJobs
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} reports {{ printf "%.2f" $value }} pending jobs.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockbuilderschedulerpendingjobs
              expr: |
                sum by (cluster, namespace, pod) (cortex_blockbuilder_scheduler_pending_jobs) > 0
              for: 40m
              labels:
                severity: warning
            - alert: MimirBlockBuilderCompactAndUploadFailed
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} fails to compact and upload blocks.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockbuildercompactanduploadfailed
              expr: |
                sum by (cluster, namespace, pod) (rate(cortex_blockbuilder_tsdb_compact_and_upload_failed_total[4m])) > 0
              labels:
                severity: critical
            - alert: MimirBlockBuilderHasNotShippedBlocks
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has not shipped any block in the last 4 hours.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockbuilderhasnotshippedblocks
              expr: |
                (min by(cluster, namespace, pod) (time() - cortex_blockbuilder_tsdb_last_successful_compact_and_upload_timestamp_seconds) > 60 * 60 * 4)
                and
                (max by(cluster, namespace, pod) (cortex_blockbuilder_tsdb_last_successful_compact_and_upload_timestamp_seconds) > 0)
                # Only if blocks aren't shipped by ingesters.
                unless on (cluster, namespace)
                (max by (cluster, namespace) (cortex_ingester_shipper_last_successful_upload_timestamp_seconds) > 0)
              for: 15m
              labels:
                severity: critical
            - alert: MimirBlockBuilderSchedulerNotRunning
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} is not running.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockbuilderschedulernotrunning
              expr: |
                max by (cluster, namespace, pod) (histogram_count(increase(cortex_blockbuilder_scheduler_schedule_update_seconds[5m])) == 0)
              for: 30m
              labels:
                severity: warning
            - alert: MimirBlockBuilderDataSkipped
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has detected skipped data.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockbuilderdataskipped
              expr: |
                sum by (cluster, namespace, pod) (
                  increase(cortex_blockbuilder_scheduler_job_gap_detected[1h])
                ) > 0
              labels:
                severity: critical
            - alert: MimirBlockBuilderPersistentJobFailure
              annotations:
                message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }} has detected a persistently failing job.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirblockbuilderpersistentjobfailure
              expr: |
                increase(cortex_blockbuilder_scheduler_persistent_job_failures_total[20m]) > 0
              labels:
                severity: critical
            - alert: MimirFewerIngestersConsumingThanActivePartitions
              annotations:
                message: Mimir ingesters in {{ $labels.cluster }}/{{ $labels.namespace }}{{ if $labels.read_compartment }}/rc-{{ $labels.read_compartment }}{{ end }} have fewer ingesters consuming than active partitions.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimirfeweringestersconsumingthanactivepartitions
              expr: |
                max by (cluster, namespace, read_compartment) (label_replace(cortex_partition_ring_partitions{name=~"ingester-partitions(-rc-[0-9]+)?", state="Active"}, "read_compartment", "$1", "name", ".*-rc-([0-9]+)"))
                  >
                (
                  count by (cluster, namespace, read_compartment) (
                    count by (cluster, namespace, read_compartment, partition) (label_replace(cortex_ingest_storage_reader_last_consumed_offset{}, "read_compartment", "$1", "job", ".*-rc-([0-9]+)"))
                  )
                    or
                  # A compartment that lost all its consumers has no series here and would drop out of the comparison, so default it to zero.
                  (max by (cluster, namespace, read_compartment) (label_replace(cortex_partition_ring_partitions{name=~"ingester-partitions(-rc-[0-9]+)?", state="Active"}, "read_compartment", "$1", "name", ".*-rc-([0-9]+)")) * 0)
                )
              for: 15m
              labels:
                severity: critical
        - name: rollout_operator_alerts
          rules:
            - alert: MimirIncorrectWebhookConfigurationFailurePolicy
              annotations:
                message: |
                    A validating or mutating rollout-operator webhook has an Ignore policy set. This should be set to Fail.
                runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#mimirincorrectwebhookconfigurationfailurepolicy
              expr: count by(type, webhook, namespace) (kube_validating_webhook_failure_policy{policy="Ignore", webhook=~"^(pod-eviction|zpdb-validation).+"} > 0)
              for: 5m
              labels:
                severity: warning
            - alert: MimirBadZoneAwarePodDisruptionBudgetConfiguration
              annotations:
                message: An invalid zone aware pod disruption budget configuration has been observed.
                runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#mimirbadzoneawarepoddisruptionbudgetconfiguration
              expr: sum by (job, namespace)(rate(rollout_operator_zpdb_configurations_observed_total{result="invalid"}[5m])) > 0
              for: 5m
              labels:
                severity: warning
            - alert: MimirHighNumberInflightZpdbRequests
              annotations:
                message: A sustained number of inflight ZPDB eviction requests has been observed.
                runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#mimirhighnumberinflightzpdbrequests
              expr: avg_over_time(rollout_operator_zpdb_inflight_eviction_requests[5m]) > 10
              for: 5m
              labels:
                severity: warning
            - alert: MimirKubernetesAPIClientRateLimited
              annotations:
                message: The rollout-operator is dropping Kubernetes API requests against the {{ $labels.api_group }} API group because its client-side rate limiter is exhausted.
                runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#mimirkubernetesapiclientratelimited
              expr: sum by (namespace, api_group) (rate(rollout_operator_kubernetes_api_client_rate_limited_requests_total[5m])) > 0
              for: 15m
              labels:
                severity: warning
            - alert: MimirKubernetesAPIClientApproachingRateLimit
              annotations:
                message: The rollout-operator pod {{ $labels.pod }}'s {{ $labels.component }} client is sustaining over 80% of its configured client-side rate limit for the {{ $labels.api_group }} Kubernetes API group. It is not yet dropping requests, but is at risk of doing so.
                runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#mimirkubernetesapiclientapproachingratelimit
              expr: |
                sum by (namespace, pod, component, api_group) (
                  rate(rollout_operator_kubernetes_api_client_request_duration_seconds_count[5m])
                  or
                  histogram_count(rate(rollout_operator_kubernetes_api_client_request_duration_seconds[5m]))
                )
                / on (namespace, pod, component) group_left()
                max by (namespace, pod, component) (rollout_operator_kubernetes_api_client_rate_limit_qps)
                > 0.8
              for: 10m
              labels:
                severity: warning
        - name: mimir_continuous_test
          rules:
            - alert: MimirContinuousTestNotRunningOnWrites
              annotations:
                message: Mimir continuous test {{ $labels.test }} in {{ $labels.cluster }}/{{ $labels.namespace }} is not effectively running because writes are failing.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircontinuoustestnotrunningonwrites
              expr: |
                sum by(cluster, namespace, test) (rate(mimir_continuous_test_writes_failed_total[5m])) > 0
              for: 1h
              labels:
                severity: warning
            - alert: MimirContinuousTestNotRunningOnReads
              annotations:
                message: Mimir continuous test {{ $labels.test }} in {{ $labels.cluster }}/{{ $labels.namespace }} is not effectively running because queries are failing.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircontinuoustestnotrunningonreads
              expr: |
                sum by(cluster, namespace, test) (rate(mimir_continuous_test_queries_failed_total[5m])) > 0
              for: 1h
              labels:
                severity: warning
            - alert: MimirContinuousTestFailed
              annotations:
                message: Mimir continuous test {{ $labels.test }} in {{ $labels.cluster }}/{{ $labels.namespace }} failed when asserting query results.
                runbook_url: https://grafana.com/docs/mimir/latest/manage/mimir-runbooks/#mimircontinuoustestfailed
              expr: |
                sum by(cluster, namespace, test) (rate(mimir_continuous_test_query_result_checks_failed_total[10m])) > 0
              labels:
                severity: warning
