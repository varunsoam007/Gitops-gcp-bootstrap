  namespace: mimir
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://kv-pin-aks-devm-int-uks.vault.azure.net/"
      serviceAccountRef:
        name: mimir
